<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المرضى | Diet Planner | د. أحمد جلال</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:'Cairo',sans-serif;background:#f8fafc;color:#0f172a}
    .patient-row{transition:.18s ease}
    .patient-row:hover{transform:translateY(-1px)}
    .loading{animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</head>

<body class="min-h-screen">

<header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg">
        <span class="text-xl">🌿</span>
      </div>
      <div>
        <h1 class="font-black text-lg leading-tight">Diet Planner</h1>
        <p class="text-xs font-bold text-emerald-400">د. أحمد جلال</p>
      </div>
    </div>

    <a href="app.html"
       class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
      لوحة التحكم
    </a>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">

  <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

    <div class="p-5 border-b border-slate-100">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="font-black text-slate-800 text-xl">ملفات المرضى</h2>
          <p class="text-xs text-slate-400 mt-1">اختر المريض لفتح ملفه الكامل.</p>
        </div>

        <button type="button" onclick="openAddPatientModal()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl transition shadow-sm">
          + إضافة مريض
        </button>
      </div>

      <div class="mt-4">
        <input id="searchInput" type="search"
          placeholder="البحث باسم المريض..."
          oninput="renderPatients()"
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:border-emerald-500">
      </div>
    </div>

    <div id="statusBox" class="px-5 pt-4"></div>
    <div id="patientsList" class="p-5 space-y-2">
      <div class="loading text-center text-sm text-slate-400 py-10">جاري تحميل المرضى...</div>
    </div>

  </section>
</main>

<!-- ADD PATIENT -->
<div id="addPatientModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="font-black text-slate-800">إضافة مريض جديد</h3>
      <button onclick="closeAddPatientModal()" class="text-slate-400 hover:text-slate-700 text-xl">×</button>
    </div>

    <div class="mt-4">
      <label class="block text-xs font-bold text-slate-600 mb-1">اسم المريض</label>
      <input id="newPatientName" type="text" placeholder="أدخل اسم المريض..."
        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:border-emerald-500">
    </div>

    <div class="flex gap-2 mt-5">
      <button onclick="createPatient()"
        class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl">
        حفظ وفتح الملف
      </button>
      <button onclick="closeAddPatientModal()"
        class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-4 py-2.5 rounded-xl">
        إلغاء
      </button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div id="deleteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-red-50 flex items-center justify-center text-2xl">🗑️</div>
    <h3 class="font-black text-slate-800 mt-3">حذف المريض</h3>
    <p id="deleteText" class="text-xs text-slate-500 mt-2"></p>

    <div class="flex gap-2 mt-5">
      <button id="confirmDeleteBtn"
        class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2.5 rounded-xl">
        حذف
      </button>
      <button onclick="closeDeleteModal()"
        class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-4 py-2.5 rounded-xl">
        إلغاء
      </button>
    </div>
  </div>
</div>

<script>
  // =========================================================
  // PATIENT DIRECTORY
  // This page only reads/manages the patients table.
  // Patient details and clinical sections live on separate pages.
  // =========================================================

  const SUPABASE_URL = "https://zwxnmnfoknfbzvptnpmv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let patients = [];
  let pendingDeleteId = null;

  function showStatus(message, type = 'error') {
    const box = document.getElementById('statusBox');
    const styles = type === 'success'
      ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
      : 'bg-red-50 border-red-200 text-red-700';

    box.innerHTML = `
      <div class="border ${styles} rounded-xl px-4 py-3 text-xs font-bold">
        ${escapeHtml(message)}
      </div>
    `;

    setTimeout(() => {
      if (box) box.innerHTML = '';
    }, 3500);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  async function getCurrentUser() {
    const { data, error } = await db.auth.getUser();
    if (error) return null;
    return data?.user || null;
  }

  async function loadPatients() {
    const box = document.getElementById('patientsList');

    const user = await getCurrentUser();

    if (!user) {
      box.innerHTML = `
        <div class="text-center py-10">
          <div class="text-3xl mb-3">🔐</div>
          <p class="font-bold text-slate-700 text-sm">يجب تسجيل الدخول أولاً.</p>
          <a href="index.html" class="inline-block mt-4 bg-emerald-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold">
            تسجيل الدخول
          </a>
        </div>
      `;
      return;
    }

    const { data, error } = await db
      .from('patients')
      .select('id,user_id,name,gender,birth_date,age,height,diagnosis,complaints,clinical_notes,created_at,updated_at')
      .eq('user_id', user.id)
      .order('name', { ascending: true });

    if (error) {
      console.error(error);
      box.innerHTML = `
        <div class="text-center py-10 text-red-600 text-sm font-bold">
          تعذر تحميل ملفات المرضى.
        </div>
      `;
      return;
    }

    patients = data || [];
    renderPatients();
  }

  function renderPatients() {
    const box = document.getElementById('patientsList');
    const q = document.getElementById('searchInput').value.trim().toLocaleLowerCase('ar-EG');

    const filtered = patients.filter(p =>
      !q || String(p.name || '').toLocaleLowerCase('ar-EG').includes(q)
    );

    if (!filtered.length) {
      box.innerHTML = `
        <div class="text-center py-12 border border-dashed border-slate-200 rounded-2xl">
          <div class="text-3xl mb-3">👤</div>
          <p class="font-bold text-slate-600 text-sm">
            ${patients.length ? 'لا يوجد مريض مطابق للبحث.' : 'لا توجد ملفات مرضى حتى الآن.'}
          </p>
        </div>
      `;
      return;
    }

    box.innerHTML = filtered.map(p => `
      <div class="patient-row flex items-center gap-3 bg-slate-50 hover:bg-emerald-50 border border-slate-200 rounded-xl p-3">

        <button type="button"
          onclick="openPatient('${escapeHtml(p.id)}')"
          class="flex-1 min-w-0 text-right flex items-center gap-3">

          <span class="w-10 h-10 shrink-0 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg">
            👤
          </span>

          <span class="min-w-0">
            <span class="block font-extrabold text-slate-800 text-sm truncate">
              ${escapeHtml(p.name || 'بدون اسم')}
            </span>
            <span class="block text-[10px] text-slate-400 mt-0.5">
              اضغط لفتح ملف المريض
            </span>
          </span>
        </button>

        <button type="button"
          onclick="askDelete('${escapeHtml(p.id)}')"
          class="w-9 h-9 shrink-0 rounded-lg bg-red-50 hover:bg-red-100 border border-red-100 text-red-600 flex items-center justify-center text-sm"
          title="حذف المريض" aria-label="حذف المريض">
          🗑️
        </button>
      </div>
    `).join('');
  }

  function openPatient(id) {
    window.location.href = 'patient-profile.html?id=' + encodeURIComponent(id);
  }

  function openAddPatientModal() {
    const modal = document.getElementById('addPatientModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => document.getElementById('newPatientName')?.focus(), 50);
  }

  function closeAddPatientModal() {
    const modal = document.getElementById('addPatientModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.getElementById('newPatientName').value = '';
  }

  async function createPatient() {
    const name = document.getElementById('newPatientName').value.trim();

    if (!name) {
      showStatus('أدخل اسم المريض أولاً.');
      return;
    }

    const user = await getCurrentUser();

    if (!user) {
      showStatus('يجب تسجيل الدخول أولاً.');
      return;
    }

    const { data, error } = await db
      .from('patients')
      .insert({
        user_id: user.id,
        name: name,
        gender: null,
        birth_date: null,
        age: null,
        height: null,
        diagnosis: null,
        complaints: null,
        clinical_notes: null
      })
      .select('*')
      .single();

    if (error) {
      console.error(error);
      showStatus('تعذر حفظ المريض في قاعدة البيانات.');
      return;
    }

    closeAddPatientModal();
    showStatus('تم حفظ المريض.', 'success');

    window.location.href = 'patient-profile.html?id=' + encodeURIComponent(data.id);
  }

  function askDelete(id) {
    const patient = patients.find(p => p.id === id);
    if (!patient) return;

    pendingDeleteId = id;

    document.getElementById('deleteText').textContent =
      `هل أنت متأكد من حذف ملف «${patient.name || 'بدون اسم'}»؟`;

    const modal = document.getElementById('deleteModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    document.getElementById('confirmDeleteBtn').onclick = deletePatient;
  }

  function closeDeleteModal() {
    pendingDeleteId = null;
    const modal = document.getElementById('deleteModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  async function deletePatient() {
    if (!pendingDeleteId) return;

    const id = pendingDeleteId;

    const user = await getCurrentUser();

    if (!user) {
      closeDeleteModal();
      showStatus('يجب تسجيل الدخول أولاً.');
      return;
    }

    const { error } = await db
      .from('patients')
      .delete()
      .eq('id', id)
      .eq('user_id', user.id);

    if (error) {
      console.error(error);
      closeDeleteModal();
      showStatus('تعذر حذف المريض.');
      return;
    }

    patients = patients.filter(p => p.id !== id);
    closeDeleteModal();
    renderPatients();
    showStatus('تم حذف المريض.', 'success');
  }

  document.addEventListener('DOMContentLoaded', loadPatients);
</script>

</body>
</html>
