<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بناء الخطة الغذائية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1500px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#0f172a,#164e63);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px #0f172a18}.hero h1{margin:0;font-size:22px;font-weight:900}.hero p{margin:7px 0 0;color:#cbd5e1;font-size:12px}.toolbar{display:grid;grid-template-columns:1.2fr 1.6fr repeat(4,110px) auto auto;gap:10px;align-items:end;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:900;color:#64748b}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#0891b2;box-shadow:0 0 0 3px #0891b215}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;white-space:nowrap}.primary{background:#0891b2;color:#fff}.primary:hover{background:#0e7490}.success{background:#059669;color:#fff}.dark{background:#0f172a;color:#fff}.light{background:#f1f5f9;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.days{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.daybtn{border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:10px;padding:9px 16px;font-weight:900;white-space:nowrap}.daybtn.active{background:#0891b2;color:#fff;border-color:#0891b2}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0f172a08}.cardhead{padding:13px 15px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:10px}.cardbody{padding:14px}.meal{border:1px solid #dbe4ec;border-radius:14px;margin-bottom:12px;overflow:hidden}.meal:last-child{margin-bottom:0}.mealhead{display:grid;grid-template-columns:38px minmax(120px,1fr) 180px auto;gap:8px;align-items:center;background:#f8fafc;padding:9px 11px}.mealnum{width:30px;height:30px;border-radius:9px;background:#cffafe;color:#0e7490;display:flex;align-items:center;justify-content:center;font-weight:900}.mealname,.mealdesc{border:1px solid transparent;background:transparent;padding:7px;border-radius:8px;outline:none}.mealname{font-weight:900}.mealdesc{font-size:11px;color:#64748b}.mealname:focus,.mealdesc:focus{border-color:#cbd5e1;background:#fff}.mealactions{display:flex;gap:2px}.iconbtn{border:0;background:transparent;color:#64748b;padding:7px;border-radius:8px}.iconbtn:hover{background:#e2e8f0;color:#0f172a}.items{padding:10px}.item{display:grid;grid-template-columns:minmax(0,1fr) 105px 105px 34px;gap:9px;align-items:center;padding:9px 4px;border-bottom:1px solid #f1f5f9}.item:last-child{border-bottom:0}.foodname{font-weight:900}.foodmeta{font-size:10px;color:#94a3b8;margin-top:3px}.grams{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:8px;text-align:center}.mini{font-size:11px;text-align:center;font-weight:800;color:#0e7490}.mealfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#f8fafc;border-top:1px solid #e2e8f0;padding:9px 12px;font-size:11px;font-weight:900;color:#475569}.addfood{padding:10px 12px;border-top:1px solid #f1f5f9;background:#fff}.foodselect{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}.empty{padding:22px;text-align:center;color:#94a3b8;background:#fafafa;border-radius:10px}.summarygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sumbox{border:1px solid #e2e8f0;border-radius:11px;padding:10px}.sumlabel{font-size:10px;color:#64748b}.sumvalue{font-weight:900;font-size:15px;margin-top:4px}.progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:#0891b2;border-radius:99px}.remaining{font-size:10px;color:#64748b;margin-top:5px}.totalday{background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;padding:12px;margin-bottom:10px}.totalday strong{font-size:18px;color:#0e7490}.targetrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:6px}.codebox{width:100%;height:500px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px;line-height:1.6;background:#0b1220;color:#e2e8f0;border:0;border-radius:12px;padding:14px;resize:vertical}.modalback{position:fixed;inset:0;background:#0f172a99;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:18px;width:min(100%,1100px);max-height:92vh;overflow:auto}.modalhead{padding:14px 17px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:16px}.notice{font-size:11px;color:#64748b;line-height:1.7}.toast{position:fixed;left:18px;bottom:18px;background:#0f172a;color:#fff;padding:11px 15px;border-radius:11px;font-weight:800;z-index:200;box-shadow:0 10px 25px #0002}
@media(max-width:1150px){.toolbar{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:650px){.wrap{padding:10px}.toolbar{grid-template-columns:1fr 1fr}.mealhead{grid-template-columns:32px 1fr auto}.mealdesc{display:none}.item{grid-template-columns:minmax(0,1fr) 80px 75px 28px}.summarygrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="libFrame" src="lib.html" style="display:none" aria-hidden="true"></iframe>
<div class="wrap">
  <div class="hero"><h1>بناء الخطة الغذائية</h1><p>أنشئ خطة لعميل من أصناف مكتبة الأغذية، راجع إجمالي كل يوم، ثم ولّد كودًا جاهزًا للإضافة إلى meals.html.</p></div>
  <div class="toolbar">
    <div class="field"><label>اسم الدايت</label><input id="dietName" placeholder="مثال: دايت 1800 سعر"></div>
    <div class="field"><label>وصف الدايت</label><input id="dietDescription" placeholder="مثال: 3 وجبات رئيسية + 2 سناك"></div>
    <div class="field"><label>السعرات / يوم</label><input id="targetCal" type="number" min="0" step="50" value="1800" oninput="renderAll()"></div>
    <div class="field"><label>Protein %</label><input id="targetPro" type="number" min="0" max="100" value="20" oninput="renderAll()"></div>
    <div class="field"><label>Carb %</label><input id="targetCarb" type="number" min="0" max="100" value="60" oninput="renderAll()"></div>
    <div class="field"><label>Fat %</label><input id="targetFat" type="number" min="0" max="100" value="20" oninput="renderAll()"></div>
    <button class="btn light" onclick="addDay()">＋ يوم</button>
    <button class="btn success" onclick="openCodeModal()">⚙ توليد الكود</button>
  </div>
  <div class="days" id="daysBar"></div>
  <div class="layout">
    <div class="card">
      <div class="cardhead"><div><strong id="dayTitle">اليوم 1</strong><div class="notice">أضف الأصناف من القوائم المنسدلة داخل الوجبات</div></div><button class="btn primary" onclick="addMeal()">＋ إضافة وجبة</button></div>
      <div class="cardbody" id="mealsArea"></div>
    </div>
    <aside>
      <div class="card">
        <div class="cardhead"><strong>إجمالي اليوم</strong><span id="dayStatus" class="notice"></span></div>
        <div class="cardbody" id="targetSummary"></div>
      </div>
    </aside>
  </div>
</div>
<div class="modalback" id="codeModal" onclick="if(event.target===this)closeCodeModal()">
  <div class="modal">
    <div class="modalhead"><div><strong>الكود الجاهز لـ meals.html</strong><div class="notice">انسخه والصقه داخل window.FIXED_MEALS</div></div><button class="iconbtn" onclick="closeCodeModal()">✕</button></div>
    <div class="modalbody"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn success" onclick="copyGeneratedCode()">نسخ الكود</button><button class="btn light" onclick="generateCode()">تحديث</button></div><textarea id="generatedCode" class="codebox" spellcheck="false"></textarea></div>
  </div>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script>
let FOOD_LIBRARY=[];let days=[];let activeDay=0;let uid=0;
const $=id=>document.getElementById(id);const newId=()=>`b_${Date.now()}_${++uid}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isInteger(Number(n))?String(Number(n)):Number(n).toFixed(1);
function blankMeal(name='وجبة جديدة'){return{id:newId(),name,description:'',items:[]}}
function blankDay(){return{id:newId(),meals:[blankMeal('الفطار'),blankMeal('سناك 1'),blankMeal('الغداء'),blankMeal('سناك 2'),blankMeal('العشاء')]}}
function init(){days=[blankDay()];renderAll()}
function renderAll(){renderDays();renderMeals();renderTargetSummary()}
function renderDays(){let h=days.map((d,i)=>`<button class="daybtn ${i===activeDay?'active':''}" onclick="activeDay=${i};renderAll()">اليوم ${i+1}</button>`).join('');if(days.length>1)h+=`<button class="daybtn" onclick="removeDay()">− حذف اليوم</button>`;$('daysBar').innerHTML=h;$('dayTitle').textContent=`اليوم ${activeDay+1}`}
function addDay(){if(days.length>=31)return toast('الحد الأقصى 31 يوم');days.push(blankDay());activeDay=days.length-1;renderAll()}
function removeDay(){if(days.length===1)return toast('يجب أن يحتوي الدايت على يوم واحد على الأقل');if(!confirm('حذف اليوم الحالي؟'))return;days.splice(activeDay,1);activeDay=Math.max(0,activeDay-1);renderAll()}
function renderMeals(){let d=days[activeDay];$('mealsArea').innerHTML=d.meals.map((m,mi)=>{let t=mealTotals(m);return `<div class="meal"><div class="mealhead"><span class="mealnum">${mi+1}</span><input class="mealname" value="${esc(m.name)}" onchange="updateMealName(${mi},this.value)"><input class="mealdesc" value="${esc(m.description)}" onchange="updateMealDesc(${mi},this.value)" placeholder="وصف الوجبة"><div class="mealactions"><button class="iconbtn" onclick="moveMeal(${mi},-1)" title="أعلى">↑</button><button class="iconbtn" onclick="moveMeal(${mi},1)" title="أسفل">↓</button><button class="iconbtn" onclick="deleteMeal(${mi})" title="حذف">✕</button></div></div><div class="items">${m.items.length?m.items.map((it,ii)=>itemHTML(it,mi,ii)).join(''):`<div class="empty">لم تتم إضافة أصناف لهذه الوجبة بعد</div>`}</div><div class="addfood"><select class="foodselect" onchange="addFoodFromSelect(${mi},this.value);this.value=''" ><option value="">＋ اختر صنفًا من مكتبة الأغذية...</option>${foodOptions()}</select></div><div class="mealfoot"><span>${fmt(t.calories)} kcal</span><span>P ${fmt(t.protein)} g</span><span>C ${fmt(t.carbs)} g</span><span>F ${fmt(t.fat)} g</span></div></div>`}).join('')}
function foodOptions(){return FOOD_LIBRARY.map(f=>`<option value="${esc(f.id)}">${esc(f.name)} — ${fmt(f.calories)} kcal/100g | P ${fmt(f.protein)} | C ${fmt(f.carbs)} | F ${fmt(f.fat)}</option>`).join('')}
function itemHTML(it,mi,ii){let f=foodById(it.foodId);if(!f)return'';let g=Number(it.grams)||0;return `<div class="item"><div><div class="foodname">${esc(f.name)}</div><div class="foodmeta">${esc(f.id)} · لكل 100g: ${fmt(f.calories)} kcal · P ${fmt(f.protein)} · C ${fmt(f.carbs)} · F ${fmt(f.fat)}</div></div><input class="grams" type="number" min="0" step="1" value="${g}" onchange="updateGrams(${mi},${ii},this.value)"><div class="mini">${fmt(f.calories*g/100)} kcal</div><button class="iconbtn" onclick="removeItem(${mi},${ii})">✕</button></div>`}
function addFoodFromSelect(mi,id){if(!id)return;days[activeDay].meals[mi].items.push({foodId:id,grams:100});renderAll()}
function updateGrams(mi,ii,v){days[activeDay].meals[mi].items[ii].grams=Math.max(0,Number(v)||0);renderAll()}
function removeItem(mi,ii){days[activeDay].meals[mi].items.splice(ii,1);renderAll()}
function addMeal(){days[activeDay].meals.push(blankMeal('وجبة جديدة'));renderAll()}
function deleteMeal(i){if(!confirm('حذف هذه الوجبة؟'))return;days[activeDay].meals.splice(i,1);renderAll()}
function moveMeal(i,dir){let j=i+dir;if(j<0||j>=days[activeDay].meals.length)return;let a=days[activeDay].meals;[a[i],a[j]]=[a[j],a[i]];renderAll()}
function updateMealName(i,v){days[activeDay].meals[i].name=v||'وجبة بدون اسم'}function updateMealDesc(i,v){days[activeDay].meals[i].description=v||''}
function foodById(id){return FOOD_LIBRARY.find(f=>f.id===id)}
function mealTotals(m){let t={calories:0,protein:0,carbs:0,fat:0};m.items.forEach(it=>{let f=foodById(it.foodId),g=Number(it.grams)||0;if(!f)return;t.calories+=Number(f.calories||0)*g/100;t.protein+=Number(f.protein||0)*g/100;t.carbs+=Number(f.carbs||0)*g/100;t.fat+=Number(f.fat||0)*g/100});return t}
function dayTotals(d){return d.meals.reduce((a,m)=>{let t=mealTotals(m);Object.keys(a).forEach(k=>a[k]+=t[k]);return a},{calories:0,protein:0,carbs:0,fat:0})}
function targets(){let cal=Math.max(0,Number($('targetCal').value)||0),pPct=Math.max(0,Number($('targetPro').value)||0),cPct=Math.max(0,Number($('targetCarb').value)||0),fPct=Math.max(0,Number($('targetFat').value)||0);return{cal,pPct,cPct,fPct,sum:pPct+cPct+fPct,p:cal*pPct/400,c:cal*cPct/400,f:cal*fPct/900}}
function renderTargetSummary(){let x=targets(),t=dayTotals(days[activeDay]);$('dayStatus').textContent=x.sum===100?'':'⚠ النسب ليست 100%';let rows=[['السعرات',t.calories,x.cal,'kcal'],['البروتين',t.protein,x.p,'g'],['الكارب',t.carbs,x.c,'g'],['الدهون',t.fat,x.f,'g']];$('targetSummary').innerHTML=`<div class="totalday"><div class="notice">إجمالي اليوم ${activeDay+1}</div><strong>${fmt(t.calories)} kcal</strong><div class="targetrow"><span>الهدف</span><b>${fmt(x.cal)} kcal</b></div></div>${x.sum!==100?`<div class="notice" style="color:#b45309;margin-bottom:10px">مجموع نسب الماكروز = ${fmt(x.sum)}% ويجب أن يساوي 100%.</div>`:''}<div class="summarygrid">${rows.map(r=>{let pct=r[2]>0?Math.min(100,r[1]/r[2]*100):0;return `<div class="sumbox"><div class="sumlabel">${r[0]}</div><div class="sumvalue">${fmt(r[1])} / ${fmt(r[2])} ${r[3]}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="remaining">المتبقي: ${fmt(r[2]-r[1])} ${r[3]}</div></div>`}).join('')}</div>`}
function generateCode(){let name=$('dietName').value.trim()||`دايت ${days.length} يوم`;let desc=$('dietDescription').value.trim();let diets=days.map((d,di)=>({name:days.length===1?name:`${name} - اليوم ${di+1}`,description:days.length===1?desc:`${desc}${desc?' | ':''}إجمالي اليوم: ${fmt(dayTotals(d).calories)} kcal`,meals:d.meals.map(m=>({name:m.name||'وجبة',description:m.description||'',items:m.items.map(it=>({foodId:it.foodId,grams:Number(it.grams)||0}))}))}));let lines=['const FIXED_MEALS = ['];diets.forEach((diet,di)=>{lines.push('  {');lines.push(`    name: ${JSON.stringify(diet.name)},`);lines.push(`    description: ${JSON.stringify(diet.description)},`);lines.push('    meals: [');diet.meals.forEach((m,mi)=>{lines.push('      {');lines.push(`        name: ${JSON.stringify(m.name)},`);lines.push(`        description: ${JSON.stringify(m.description)},`);lines.push('        items: [');m.items.forEach((it,ii)=>lines.push(`          { foodId: ${JSON.stringify(it.foodId)}, grams: ${it.grams} }${ii<m.items.length-1?',':''}`));lines.push('        ]');lines.push(`      }${mi<diet.meals.length-1?',':''}`)});lines.push('    ]');lines.push(`  }${di<diets.length-1?',':''}`)});lines.push('];');$('generatedCode').value=lines.join('\n')}
function openCodeModal(){generateCode();$('codeModal').style.display='flex'}function closeCodeModal(){$('codeModal').style.display='none'}async function copyGeneratedCode(){let text=$('generatedCode').value;try{await navigator.clipboard.writeText(text)}catch(e){$('generatedCode').select();document.execCommand('copy')}toast('تم نسخ الكود')}
function toast(msg){let t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2200)}
$('libFrame').addEventListener('load',()=>{try{let lib=$('libFrame').contentWindow.FOOD_LIBRARY;if(Array.isArray(lib)){FOOD_LIBRARY=lib.map((f,i)=>({...f,id:f.id||`lib_${i+1}`}));renderAll()}}catch(e){toast('تعذر تحميل مكتبة الأغذية')}});
init();
</script>
</body>
</html>
