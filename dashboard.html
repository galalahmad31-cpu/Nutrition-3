<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NICU Nutrition Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      min-height:100vh;
    }

    .container{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;
      background:white;
      padding:40px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .title{
      font-size:28px;
      font-weight:bold;
      color:#1e3a8a;
      margin-bottom:10px;
    }

    .subtitle{
      color:#666;
      margin-bottom:30px;
      line-height:1.5;
    }

    .user-box{
      background:#eff6ff;
      padding:15px;
      border-radius:12px;
      margin-bottom:25px;
    }

    .user-label{
      font-size:13px;
      color:#666;
      margin-bottom:5px;
    }

    .user-email{
      font-weight:bold;
      color:#111827;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:1px solid #d1d5db;
      margin-bottom:15px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .logout-btn{
      margin-top:15px;
      background:#dc2626;
    }

    .logout-btn:hover{
      background:#b91c1c;
    }

    .dashboard{
      display:none;
    }

    .dashboard-card{
      background:white;
      padding:40px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      width:100%;
      max-width:700px;
    }

    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#dbeafe;
      color:#1e40af;
      margin-top:15px;
      font-size:14px;
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- ONBOARDING -->
    <div class="card" id="onboarding-card">

      <div class="title">
        Welcome to NICU Nutrition
      </div>

      <div class="subtitle">
        Create your NICU organization to start managing neonatal nutrition workflows.
      </div>

      <div class="user-box">
        <div class="user-label">
          Signed in as
        </div>

        <div class="user-email" id="user-email"></div>
      </div>

      <input
        type="text"
        id="organization-name"
        placeholder="NICU Organization Name"
      />

      <button id="create-organization-btn">
        Create Organization
      </button>

      <button class="logout-btn" id="logout-btn">
        Logout
      </button>

    </div>


    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard-view">

      <div class="dashboard-card">

        <div class="title">
          NICU Nutrition Dashboard
        </div>

        <div class="subtitle">
          Authentication and organization system initialized successfully.
        </div>

        <div id="dashboard-email"></div>

        <div class="badge" id="organization-badge"></div>

        <button class="logout-btn" id="dashboard-logout-btn">
          Logout
        </button>

      </div>

    </div>

  </div>

  <script type="module" src="dashboard.js"></script>

</body>
  </html>
