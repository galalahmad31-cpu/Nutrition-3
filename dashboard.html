<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiCU Nutrition</title>

  <script type="module" src="./dashboard.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      min-height:100vh;
    }

    .container{
      width:100%;
      max-width:450px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:30px;
      box-shadow:0 4px 20px rgba(0,0,0,0.08);
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
      color:#16325B;
    }

    p{
      color:#555;
      margin-bottom:20px;
      line-height:1.5;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #d0d7e2;
      border-radius:10px;
      margin-bottom:15px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#16325B;
      color:white;
      font-size:15px;
      cursor:pointer;
      margin-bottom:10px;
    }

    button:hover{
      opacity:0.95;
    }

    .logout{
      background:#dc3545;
    }

    .dashboard{
      display:none;
    }

    .badge{
      display:inline-block;
      background:#e8eef8;
      color:#16325B;
      padding:8px 12px;
      border-radius:10px;
      margin-bottom:20px;
      font-weight:bold;
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- CREATE ORGANIZATION -->
    <div class="card" id="onboarding-card">

      <h1>Create Organization</h1>

      <p>
        Create your NICU department organization and invite your clinical nutrition team.
      </p>

      <input
        type="text"
        id="organization-name"
        placeholder="NICU Department Name"
      />

      <button id="create-organization-btn">
        Create Organization
      </button>

      <button class="logout" id="logout-btn">
        Logout
      </button>

    </div>


    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashboard-view">

      <h1>NiCU Nutrition</h1>

      <div class="badge" id="organization-badge"></div>

      <p id="user-email"></p>

      <button class="logout" id="dashboard-logout-btn">
        Logout
      </button>

    </div>

  </div>

</body>
</html>
