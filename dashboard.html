<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>NiCU Nutrition</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      min-height:100vh;
      color:#16325B;
    }

    .container{
      width:100%;
      max-width:500px;
      margin:auto;
      padding:40px 20px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0 4px 20px rgba(0,0,0,0.08);
    }

    h1{
      font-size:30px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#666;
      margin-bottom:25px;
      line-height:1.6;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #d6dce5;
      border-radius:12px;
      margin-bottom:15px;
      font-size:15px;
    }

    button{
      width:100%;
      border:none;
      border-radius:12px;
      padding:14px;
      font-size:15px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.95;
    }

    .primary-btn{
      background:#16325B;
      color:white;
      margin-bottom:10px;
    }

    .logout-btn{
      background:#dc3545;
      color:white;
    }

    .dashboard{
      display:none;
    }

    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:10px;
      background:#e8eef8;
      margin-bottom:20px;
      font-weight:bold;
    }

    .section{
      margin-top:25px;
    }

    .section h3{
      margin-bottom:10px;
    }

    .invite-box{
      display:flex;
      gap:10px;
    }

    .invite-box input{
      margin-bottom:0;
    }

  </style>

</head>

<body>

  <div class="container">

    <!-- ONBOARDING -->
    <div class="card" id="onboarding-card">

      <h1>Create Organization</h1>

      <p class="subtitle">
        Create your NICU clinical nutrition organization and invite your team.
      </p>

      <input
        type="text"
        id="organization-name"
        placeholder="Organization Name"
      />

      <button
        class="primary-btn"
        id="create-organization-btn"
      >
        Create Organization
      </button>

      <button
        class="logout-btn"
        id="logout-btn"
      >
        Logout
      </button>

    </div>


    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashboard-view">

      <h1>NiCU Nutrition</h1>

      <div
        class="badge"
        id="organization-badge"
      ></div>

      <p id="user-email"></p>


      <!-- TEAM INVITE -->
      <div class="section">

        <h3>Invite Team Member</h3>

        <div class="invite-box">

          <input
            type="email"
            id="invite-email"
            placeholder="doctor@email.com"
          />

        </div>

        <button
          class="primary-btn"
          id="invite-btn"
          style="margin-top:10px;"
        >
          Send Invitation
        </button>

      </div>


      <!-- TEAM LIST -->
      <div class="section">

        <h3>Team Members</h3>

        <div id="members-list"></div>

      </div>


      <div class="section">

        <button
          class="logout-btn"
          id="dashboard-logout-btn"
        >
          Logout
        </button>

      </div>

    </div>

  </div>

  <script type="module" src="./dashboard.js"></script>

</body>
  </html>
