<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Planner | متابعة الوزن | د. أحمد جلال</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }


        .day-card.day-locked .day-editable-disabled { opacity:.58; }
        .day-card.day-locked input, .day-card.day-locked select, .day-card.day-locked textarea { cursor:not-allowed; }
        .day-card .day-save-btn:disabled { opacity:.45; cursor:not-allowed; }
        .day-card .day-edit-btn:disabled { opacity:.55; cursor:not-allowed; }
        @media (max-width:640px){
            body{font-size:13px}
            .day-card .p-4{padding:.75rem}
            .day-card input,.day-card select,.day-card textarea{font-size:11px!important}
            .day-card .day-edit-btn,.day-card .day-save-btn{padding:.35rem .55rem!important;font-size:10px!important}
            .day-card .meal-header{gap:.5rem}
        }

        .print-only {
            display: none !important;
        }

        /* Patient directory / profile navigation */
        body.patient-directory-view main > :not(#patientManager) { display: none !important; }
        body.patient-profile-view main > #patientManager { display: none !important; }
        .patient-back-btn { white-space: nowrap; }

        @media print {
            .no-print {
                display: none !important;
            }

        .print-only {
                display: block !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
            }
            .page-break {
                page-break-inside: avoid;
                margin-bottom: 20px;
                border: 1px solid #e2e8f0 !important;
                border-radius: 12px !important;
            }
            .collapsible-body {
                display: block !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl {
                box-shadow: none !important;
            }
            .border {
                border-color: #cbd5e1 !important;
            }
            textarea, input, select {
                border-color: #cbd5e1 !important;
                background-color: transparent !important;
            }
            table th, table td {
                padding: 8px !important;
                border-bottom: 1px solid #f1f5f9;
            }
            .meal-header {
                background-color: #f8fafc !important;
                -webkit-print-color-adjust: exact;
                color-adjust: exact;
            }
        }
        .custom-food-badge{display:inline-block}

    </style>
<style>
/* Mobile-only typography/layout refinement. No desktop styles or functionality changed. */
@media (max-width:640px){
    html{font-size:14px}
    body{font-size:12px!important;line-height:1.55}
    header .max-w-7xl{height:54px!important;padding-left:10px!important;padding-right:10px!important}
    header .w-10{width:34px!important;height:34px!important}
    header .w-10 i{font-size:16px!important}
    header h1{font-size:16px!important}
    header p{font-size:11px!important}
    header .px-3\.5{padding-left:9px!important;padding-right:9px!important}
    header .py-2{padding-top:6px!important;padding-bottom:6px!important}
    header .text-xs{font-size:10px!important}
    main{padding-left:10px!important;padding-right:10px!important;padding-top:12px!important;padding-bottom:16px!important;gap:12px!important}
    main.space-y-6> :not([hidden])~ :not([hidden]){margin-top:12px!important}

    /* Patient profile */
    #patientManager{padding:11px!important;border-radius:15px!important}
    #patientManager h2{font-size:14px!important}
    #patientManager p{font-size:9px!important}
    #patientManager input{font-size:11px!important;padding-top:8px!important;padding-bottom:8px!important}
    #patientManager button{font-size:10px!important;padding:8px 11px!important}

    #patientManager + section{padding:12px!important;border-radius:15px!important;gap:10px!important}
    #patientManager + section h2{font-size:14px!important;line-height:1.45!important}
    #patientManager + section h2 i{font-size:12px!important}
    #patientManager + section label{font-size:10px!important;margin-bottom:3px!important}
    #patientManager + section input,
    #patientManager + section select,
    #patientManager + section textarea{font-size:11px!important;padding:8px 10px!important;border-radius:10px!important;line-height:1.5!important}
    #patientManager + section textarea{min-height:52px!important}
    #patientManager + section .grid{gap:8px!important}
    #patientManager + section .gap-4{gap:8px!important}
    #patientManager + section .gap-2{gap:6px!important}
    #patientManager + section .py-2\.5{padding-top:7px!important;padding-bottom:7px!important}
    #patientManager + section .px-5{padding-left:12px!important;padding-right:12px!important}
    #patientManager + section .text-base{font-size:14px!important}
    #patientManager + section .text-sm{font-size:11px!important}
    #patientManager + section .text-xs{font-size:9px!important}

    /* Main tabs */
    main > .border-b{gap:5px!important;padding-bottom:4px!important}
    main > .border-b .tab-btn{font-size:10px!important;padding:7px 10px!important;border-radius:9px!important;gap:5px!important}
    main > .border-b .tab-btn i{font-size:10px!important}

    /* Diet days */
    #planTab{gap:12px!important}
    #planTab h3{font-size:16px!important}
    #planTab .no-print button{font-size:10px!important;padding:7px 10px!important}
    .day-card{border-radius:14px!important}
    .day-card .text-xl{font-size:16px!important}
    .day-card .text-2xl{font-size:18px!important}
    .day-card .text-lg{font-size:14px!important}
    .day-card .text-base{font-size:13px!important}
    .day-card .text-sm{font-size:11px!important}
    .day-card .text-xs{font-size:9px!important}
    .day-card .text-\[10px\]{font-size:9px!important}
    .day-card .text-\[9px\]{font-size:8px!important}
    .day-card .p-5{padding:11px!important}
    .day-card .p-4{padding:9px!important}
    .day-card .px-3{padding-left:8px!important;padding-right:8px!important}
    .day-card .py-3{padding-top:8px!important;padding-bottom:8px!important}
    .day-card .gap-4{gap:8px!important}
    .day-card .gap-3{gap:7px!important}
    .day-card .gap-2{gap:5px!important}
    .day-card .day-edit-btn,.day-card .day-save-btn{padding:5px 8px!important;font-size:9px!important}
    .day-card .day-action-always.w-8{width:27px!important;height:27px!important}
    .day-card input,.day-card select,.day-card textarea{font-size:10px!important;padding:7px 8px!important}
    .day-card table{font-size:9px!important}

    /* Calculator / weight sections */
    #calcTab>div,#weightTab>div{border-radius:14px!important}
    #calcTab h3,#weightTab h3{font-size:13px!important}
    #calcTab label,#weightTab label{font-size:10px!important}
    #calcTab input,#calcTab select,#weightTab input,#weightTab select{font-size:10px!important;padding:7px 8px!important}
    #calcTab button,#weightTab button{font-size:10px!important}
    #calcTab .text-xl,#weightTab .text-2xl{font-size:17px!important}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth-access.js"></script>
<script src="js/weight.js" defer></script>
<style>
.chart-empty{height:100%;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-size:12px;font-weight:700}
.chart-empty i{font-size:24px;color:#10b981}
.chart-shell{position:relative;width:100%;height:100%;min-height:220px;overflow:hidden}
.weight-chart{width:100%;height:100%;display:block;overflow:visible}
.chart-grid{stroke:#e2e8f0;stroke-width:1}
.chart-axis,.chart-date{font-family:Cairo,sans-serif;fill:#64748b}
.chart-axis{font-size:11px}
.chart-date{font-size:10px}
.chart-line{fill:none;stroke:#059669;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#weightAreaGradient)}
.chart-dot{fill:#059669;stroke:#fff;stroke-width:2.5;cursor:pointer;transition:r .15s ease}
.chart-dot:hover{r:6}
.chart-focus{stroke:#94a3b8;stroke-width:1;stroke-dasharray:4 4;opacity:0}
.chart-focus-dot{fill:#fff;stroke:#059669;stroke-width:3;opacity:0}
.chart-tooltip{position:absolute;z-index:5;min-width:120px;padding:8px 10px;background:#0f172a;color:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);font:700 11px/1.7 Cairo,sans-serif;pointer-events:none;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s ease}
.chart-tooltip.show{opacity:1}
.chart-tooltip strong{display:block;color:#6ee7b7;font-size:13px}
@media(max-width:640px){.chart-shell{min-height:220px}.chart-date{font-size:9px}}
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 no-print">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40"><i class="fa-solid fa-leaf text-white text-xl"></i></div>
<div><h1 class="font-black text-lg sm:text-xl tracking-tight leading-tight">Diet Planner</h1><p class="text-sm font-bold text-emerald-400">د. أحمد جلال</p></div>
</div>
<div class="flex items-center gap-2">
<a id="dashboardBtn" href="app.html" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition shadow-sm flex items-center gap-2"><i class="fa-solid fa-house"></i><span>لوحة التحكم</span></a>
<a id="backBtn" href="#" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition shadow-sm flex items-center gap-2"><i class="fa-solid fa-arrow-right"></i><span>ملف المريض</span></a>
</div>
</div></header>
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
<section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
<div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center"><i class="fa-solid fa-chart-line"></i></div><div><h2 class="font-black text-slate-800 text-base">متابعة الوزن</h2><p id="patientName" class="text-[10px] text-slate-400 mt-1">جاري تحميل بيانات المريض...</p></div></div>
</section>
        <section id="weightTab" class="space-y-6">
             <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span class="block text-xs font-bold text-slate-400 mb-1">الوزن الأولي المسجل</span>
                    <div class="flex items-baseline gap-1">
                        <span id="kpiStartWeight" class="text-2xl font-black text-slate-800">--</span>
                        <span class="text-xs font-semibold text-slate-500">كجم</span>
                    </div>
                </div>
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span class="block text-xs font-bold text-slate-400 mb-1">الوزن الحالي الأخير</span>
                    <div class="flex items-baseline gap-1">
                        <span id="kpiCurrentWeight" class="text-2xl font-black text-emerald-600">--</span>
                        <span class="text-xs font-semibold text-slate-500">كجم</span>
                    </div>
                </div>
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span class="block text-xs font-bold text-slate-400 mb-1">التغير الكلي</span>
                    <div class="flex items-baseline gap-1">
                        <span id="kpiTotalDiff" class="text-2xl font-black text-slate-800">--</span>
                        <span class="text-xs font-semibold text-slate-500">كجم</span>
                    </div>
                </div>
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                    <span class="block text-xs font-bold text-slate-400 mb-1">مؤشر كتلة الجسم (BMI)</span>
                    <div class="flex items-baseline gap-1">
                        <span id="kpiBMI" class="text-2xl font-black text-slate-800">--</span>
                    </div>
                    <span id="kpiBMIStatus" class="text-xs block font-bold mt-0.5 text-slate-400">غير محدد</span>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                            <tr>
                                <th class="py-3 px-3">التاريخ</th>
                                <th class="py-3 px-3 text-center">الوزن</th>
                                <th class="py-3 px-3 text-center">التغير</th>
                                <th class="py-3 px-2 text-center no-print">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="weightTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4 no-print">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-emerald-600"></i>
                        <span>تسجيل قياس وزن جديد</span>
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ القياس</label>
                            <input type="date" id="weightLogDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">الوزن (كجم)</label>
                            <input type="number" step="0.1" id="weightLogVal" placeholder="مثال: 78.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-emerald-500">
                        </div>
                        <button id="addWeightBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-sm cursor-pointer active:scale-95">
                            إضافة القياس
                        </button>
                    </div>
                </div>
                
                <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-chart-area text-emerald-600"></i>
                        <span>منحنى تطور الوزن الزمني</span><select id="weightAxisStep" class="mr-auto bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-[10px] font-bold text-slate-600"><option value="0.5">0.5 كجم</option><option value="1" selected>1 كجم</option><option value="2">2 كجم</option><option value="5">5 كجم</option></select>
                    </h3>
                    <div id="weightChartContainer" class="w-full h-64 flex items-center justify-center bg-white rounded-xl border border-slate-100 p-2"></div>
                </div>
            </div>
            
            
        </section></main>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg"></div></body></html>
