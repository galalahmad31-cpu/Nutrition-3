<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>NICU Nutrition</title>

  <link rel="stylesheet" href="style.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f4f7fb;
    }

    .login-card{
      width:400px;
      background:white;
      padding:40px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      text-align:center;
    }

    .logo{
      font-size:32px;
      font-weight:bold;
      color:#1e3a8a;
      margin-bottom:10px;
    }

    .subtitle{
      color:#666;
      margin-bottom:30px;
      line-height:1.5;
    }

    .google-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .google-btn:hover{
      background:#1d4ed8;
    }

    .footer{
      margin-top:20px;
      font-size:13px;
      color:#888;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      NICU Nutrition
    </div>

    <div class="subtitle">
      Neonatal Nutrition Management Platform
    </div>

    <button id="google-login" class="google-btn">
      Continue with Google
    </button>

    <div class="footer">
      Secure clinical nutrition workflow
    </div>

  </div>

  <script type="module" src="login.js"></script>

</body>
</html>
