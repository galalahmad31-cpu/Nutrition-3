<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — كلمة مرور جديدة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:#f7fafb;display:flex;align-items:center;justify-content:center;color:#17252a}.card{width:min(430px,92%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 45px rgba(15,71,67,.10);padding:30px}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:#178f84;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px}h1{text-align:center;margin:0;font-size:24px;font-weight:800}.sub{text-align:center;color:#64748b;margin:8px 0 25px;font-size:13px;line-height:1.8}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;outline:0;font-size:15px;font-family:inherit}.field input:focus{border-color:#178f84;box-shadow:0 0 0 3px rgba(23,143,132,.08)}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#178f84;color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.back{text-align:center;margin-top:16px}.back a{color:#11786f;text-decoration:none;font-size:12px;font-weight:700}.msg{display:none;margin-bottom:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.msg.error{background:#fef2f2;color:#b42318}.msg.success{background:#ecfdf3;color:#067647}
</style>
</head>
<body>
<div class="card">
<div class="logo">✓</div>
<h1>إنشاء كلمة مرور جديدة</h1>
<div class="sub">اختر كلمة مرور جديدة لحسابك ثم أكدها.</div>
<div id="message" class="msg"></div>
<form id="updateForm">
<div class="field"><label>كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div>
<button id="updateButton" type="submit" class="btn">حفظ كلمة المرور الجديدة</button>
</form>
<div class="back"><a href="index.html">العودة إلى تسجيل الدخول</a></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = 'https://zwxnmnfoknfbzvptnpmv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('updateForm');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const button = document.getElementById('updateButton');
  const message = document.getElementById('message');

  let recoveryReady = false;
  let saving = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `msg ${type}`;
    message.style.display = 'block';
  }

  function setButtonState(disabled, text) {
    button.disabled = disabled;
    button.textContent = text;
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
    }
  });

  async function prepareRecoverySession() {
    const { data, error } = await supabase.auth.getSession();

    if (error) {
      throw error;
    }

    if (data?.session) {
      recoveryReady = true;
    }
  }

  prepareRecoverySession().catch((error) => {
    showMessage(
      `تعذر فتح جلسة الاستعادة: ${error?.message || 'حدث خطأ غير معروف.'}`,
      'error'
    );
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    if (saving) return;

    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (password.length < 6) {
      showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showMessage('كلمتا المرور غير متطابقتين.', 'error');
      return;
    }

    saving = true;
    setButtonState(true, 'جاري حفظ كلمة المرور...');

    try {
      await prepareRecoverySession();

      if (!recoveryReady) {
        throw new Error(
          'رابط استعادة كلمة المرور غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا.'
        );
      }

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        throw error;
      }

      passwordInput.value = '';
      confirmInput.value = '';

      showMessage(
        'تم تغيير كلمة المرور وحفظها بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.',
        'success'
      );

      setButtonState(false, 'تم الحفظ بنجاح');

    } catch (error) {
      showMessage(
        `تعذر تغيير كلمة المرور: ${error?.message || 'حدث خطأ غير معروف.'}`,
        'error'
      );
      setButtonState(false, 'حفظ كلمة المرور الجديدة');
    } finally {
      saving = false;
    }
  });
});
</script>
</body>
</html>
