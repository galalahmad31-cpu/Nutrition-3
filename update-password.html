<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — كلمة مرور جديدة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/update-password.css">
  <link rel="stylesheet" href="css/theme.css" data-diet-planner-theme="true">
  <script src="js/theme.js" data-diet-planner-theme="true"></script>
</head>
<body>
<div class="card">
<div class="logo">✓</div>
<h1>إنشاء كلمة مرور جديدة</h1>
<div class="sub">اختر كلمة مرور جديدة لحسابك ثم أكدها.</div>
<div id="message" class="msg"></div>
<form id="updateForm">
<div class="field">
<label>كلمة المرور الجديدة</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" required>
<div class="password-hint">استخدم 8 أحرف أو أكثر، مع حرف كبير وحرف صغير ورقم ورمز.</div>
<div class="strength"><div id="strengthBar" class="strength-bar"></div></div>
<div id="strengthText" class="strength-text"></div>
</div>
<div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div>
<button id="updateButton" type="submit" class="btn">حفظ كلمة المرور الجديدة</button>
</form>
<div class="back"><a href="index.html" id="backToLogin">العودة إلى تسجيل الدخول</a></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = 'https://zwxnmnfoknfbzvptnpmv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('updateForm');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const button = document.getElementById('updateButton');
  const message = document.getElementById('message');
  const backToLogin = document.getElementById('backToLogin');

  backToLogin?.addEventListener('click', (event) => {
    event.preventDefault();
    window.location.replace('index.html');
  });

  let recoveryReady = false;
  let saving = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `msg ${type}`;
    message.style.display = 'block';
  }

  function setButtonState(disabled, text) {
    button.disabled = disabled;
    button.textContent = text;
  }
  function isStrongPassword(password) {
    return (
      password.length >= 8 &&
      /[a-z]/.test(password) &&
      /[A-Z]/.test(password) &&
      /\d/.test(password) &&
      /[^A-Za-z0-9]/.test(password)
    );
  }

  const STRONG_PASSWORD_MESSAGE =
    'كلمة المرور يجب أن تحتوي على 8 أحرف على الأقل، وحرف كبير، وحرف صغير، ورقم، ورمز.';

  function updatePasswordStrength(value) {
    const bar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    let score = 0;
    if (value.length >= 8) score++;
    if (/[a-z]/.test(value)) score++;
    if (/[A-Z]/.test(value)) score++;
    if (/\d/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;

    const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
    const labels = ['', 'ضعيفة', 'ضعيفة', 'متوسطة', 'جيدة', 'قوية'];

    bar.style.width = widths[score];
    strengthText.textContent = value ? `قوة كلمة المرور: ${labels[score]}` : '';
  }

  passwordInput.addEventListener('input', () => {
    updatePasswordStrength(passwordInput.value);
  });


  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
    }
  });

  async function prepareRecoverySession() {
    const { data, error } = await supabase.auth.getSession();

    if (error) {
      throw error;
    }

    if (data?.session) {
      recoveryReady = true;
    }
  }

  prepareRecoverySession().catch((error) => {
    showMessage(
      `تعذر فتح جلسة الاستعادة: ${error?.message || 'حدث خطأ غير معروف.'}`,
      'error'
    );
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    if (saving) return;

    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (!isStrongPassword(password)) {
      showMessage(STRONG_PASSWORD_MESSAGE, 'error');
      return;
    }

    if (password !== confirmPassword) {
      showMessage('كلمتا المرور غير متطابقتين.', 'error');
      return;
    }

    saving = true;
    setButtonState(true, 'جاري حفظ كلمة المرور...');

    try {
      await prepareRecoverySession();

      if (!recoveryReady) {
        throw new Error(
          'رابط استعادة كلمة المرور غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا.'
        );
      }

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        throw error;
      }

      passwordInput.value = '';
      confirmInput.value = '';

      showMessage(
        'تم تغيير كلمة المرور وحفظها بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.',
        'success'
      );

      setButtonState(false, 'تم الحفظ بنجاح');

    } catch (error) {
      showMessage(
        `تعذر تغيير كلمة المرور: ${error?.message || 'حدث خطأ غير معروف.'}`,
        'error'
      );
      setButtonState(false, 'حفظ كلمة المرور الجديدة');
    } finally {
      saving = false;
    }
  });
});
</script>
</body>
</html>
