name: Temporary Core migration - Nutrition Support Patient

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(core): migrate nutrition support patient') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate page to Core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('js/nutritionsupport-patient.js')
          html = Path('nutritionsupport-patient.html')

          j = js.read_text(encoding='utf-8')
          old = """const access = window.DietPlannerAccess;
          const supabaseClient = access?.supabaseClient;"""
          new = """const access = window.DietPlannerCoreAccess;
          const supabaseClient = window.DietPlannerSupabase?.client;"""
          if old not in j:
              raise SystemExit('Expected legacy Core boundary not found in JS')
          j = j.replace(old, new, 1)

          old_error = "DietPlannerAccess is not available. Check that auth-access.js is loaded from the same folder."
          new_error = "Diet Planner Core is not available. Check that Core files are loaded before this page script."
          if old_error in j:
              j = j.replace(old_error, new_error, 1)

          old_notice = "تعذر تشغيل نظام الاتصال بالتطبيق. تأكد من وجود auth-access.js بجوار الصفحة."
          new_notice = "تعذر تشغيل نظام الاتصال بالتطبيق. تأكد من تحميل ملفات Core."
          if old_notice in j:
              j = j.replace(old_notice, new_notice, 1)

          # Keep the architecture documentation aligned with the actual Core.
          j = j.replace(
              "1) auth-access.js\n      - owns authentication/access layer\n      - exposes window.DietPlannerAccess.supabaseClient\n      - exposes getCurrentUser()",
              "1) Core (supabase.js / auth.js / access.js)\n      - owns authentication/access layer\n      - exposes window.DietPlannerSupabase.client\n      - exposes window.DietPlannerCoreAccess"
          )

          h = html.read_text(encoding='utf-8')
          old_scripts = '''<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script>\n<script src=\"js/auth-access.js?v=20260923-1\"></script>\n<script src=\"js/nutritionsupport-patient.js?v=20260922-2\"></script>'''
          new_scripts = '''<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script>\n<script src=\"js/core/supabase.js\"></script>\n<script src=\"js/core/auth.js\"></script>\n<script src=\"js/core/access.js\"></script>\n<script src=\"js/nutritionsupport-patient.js?v=20260922-2\"></script>'''
          if old_scripts not in h:
              raise SystemExit('Expected legacy script block not found in HTML')
          h = h.replace(old_scripts, new_scripts, 1)

          js.write_text(j, encoding='utf-8')
          html.write_text(h, encoding='utf-8')
          PY

          node --check js/nutritionsupport-patient.js

          if grep -q "const access = window.DietPlannerAccess;" js/nutritionsupport-patient.js; then
            echo "Legacy access boundary remains"; exit 1
          fi
          if grep -q 'js/auth-access.js' nutritionsupport-patient.html; then
            echo "Legacy auth script remains in HTML"; exit 1
          fi

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_core_migrate_ns_patient.yml
          git add js/nutritionsupport-patient.js nutritionsupport-patient.html .github/workflows/_core_migrate_ns_patient.yml
          git commit -m 'chore(core): migrate nutrition support patient'
          git push
