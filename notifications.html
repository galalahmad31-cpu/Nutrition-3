<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الإشعارات | Diet Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>
tailwind.config={theme:{extend:{fontFamily:{cairo:['Cairo','sans-serif']},colors:{brand:{50:'#eef7f6',100:'#d9efec',500:'#178f84',600:'#11786f',700:'#0d625b',800:'#0b504b'}}}}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,sans-serif;background:radial-gradient(circle at 90% 0%,rgba(23,143,132,.10),transparent 28%),radial-gradient(circle at 5% 95%,rgba(23,143,132,.07),transparent 25%),#f7fafb;color:#17252a}
.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(226,232,240,.9)}
.card{transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(15,71,67,.08)}
.tab-btn.active{background:#fff;color:#11786f;box-shadow:0 4px 12px rgba(15,71,67,.08)}
.loading{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#f7fafb}
.spinner{width:36px;height:36px;border:3px solid #d9efec;border-top-color:#178f84;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body class="min-h-screen">

<div id="loading" class="loading">
  <div class="flex flex-col items-center gap-3">
    <div class="spinner"></div>
    <div class="text-sm font-semibold text-slate-500">جاري تحميل الإشعارات...</div>
  </div>
</div>

<main class="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
<div class="mx-auto max-w-4xl">

<header class="glass rounded-3xl px-5 py-5 sm:px-7 sm:py-6 shadow-sm">
  <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-4">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg">
        <i class="fa-solid fa-bell text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-slate-800 sm:text-3xl">الإشعارات</h1>
        <p class="mt-1 text-sm font-medium text-slate-500">تنبيهات الاشتراكات ومواعيد المتابعة</p>
      </div>
    </div>

    <a href="app.html" class="flex h-11 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-bold text-slate-600">
      <i class="fa-solid fa-arrow-right"></i>
      الرئيسية
    </a>
  </div>
</header>

<section class="mt-6 glass rounded-3xl p-3 sm:p-4">
  <div class="grid grid-cols-3 gap-2 rounded-2xl bg-slate-100 p-1.5">
    <button data-tab="today" class="tab-btn active rounded-xl px-2 py-3 text-xs sm:text-sm font-extrabold transition">
      <i class="fa-solid fa-calendar-day ml-1"></i> متابعات اليوم
      <span id="todayCount" class="mr-1 inline-flex min-w-6 items-center justify-center rounded-full bg-white px-1.5 py-0.5 text-[10px]">0</span>
    </button>
    <button data-tab="tomorrow" class="tab-btn rounded-xl px-2 py-3 text-xs sm:text-sm font-extrabold text-slate-500 transition">
      <i class="fa-solid fa-calendar-plus ml-1"></i> متابعات الغد
      <span id="tomorrowCount" class="mr-1 inline-flex min-w-6 items-center justify-center rounded-full bg-white/70 px-1.5 py-0.5 text-[10px]">0</span>
    </button>
    <button data-tab="subscriptions" class="tab-btn rounded-xl px-2 py-3 text-xs sm:text-sm font-extrabold text-slate-500 transition">
      <i class="fa-solid fa-credit-card ml-1"></i> الاشتراكات
      <span id="subscriptionCount" class="mr-1 inline-flex min-w-6 items-center justify-center rounded-full bg-white/70 px-1.5 py-0.5 text-[10px]">0</span>
    </button>
  </div>
  <div class="mt-4 flex items-center justify-between gap-3 px-1">
    <div>
      <h2 id="tabTitle" class="font-extrabold text-slate-800">متابعات اليوم</h2>
      <p id="tabSubtitle" class="mt-1 text-xs text-slate-500">المرضى الذين موعد متابعتهم اليوم.</p>
    </div>
    <div id="count" class="flex h-9 min-w-9 items-center justify-center rounded-full bg-brand-50 px-3 text-sm font-extrabold text-brand-700">0</div>
  </div>
</section>

<section class="mt-5">
  <div id="notifications" class="space-y-3"></div>
  <div id="empty" class="hidden glass rounded-3xl p-12 text-center">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-500">
      <i class="fa-regular fa-calendar-check text-2xl"></i>
    </div>
    <h3 id="emptyTitle" class="mt-4 font-extrabold text-slate-800">لا توجد متابعات اليوم</h3>
    <p id="emptyText" class="mt-2 text-sm text-slate-500">لا توجد مواعيد متابعة مسجلة لهذا اليوم.</p>
  </div>
</section>

<footer class="py-8 text-center text-xs text-slate-400">Diet Planner • Clinical Nutrition</footer>
</div>
</main>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://zwxnmnfoknfbzvptnpmv.supabase.co','sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY');
const $=id=>document.getElementById(id);
let all={today:[],tomorrow:[],subscriptions:[]},activeTab='today';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dateOnly(v){const d=new Date(String(v).slice(0,10)+'T00:00:00');return d}
function daysUntil(target,today){return Math.round((dateOnly(target)-dateOnly(today))/86400000)}
function fmt(v){if(!v)return'—';const [y,m,d]=String(v).slice(0,10).split('-');return`${d}/${m}/${y}`}
function add(list,row,type,title,text,icon,box,date){list.push({patientName:row.patients?.name||'المريض',type,title,text,icon,box,date})}
function render(){
 const list=all[activeTab]||[];$('count').textContent=list.length;$('notifications').innerHTML='';
 const titles={today:['متابعات اليوم','المرضى الذين موعد متابعتهم اليوم.','لا توجد متابعات اليوم','لا توجد مواعيد متابعة مسجلة لهذا اليوم.'],tomorrow:['متابعات الغد','المرضى الذين موعد متابعتهم غدًا.','لا توجد متابعات غدًا','لا توجد مواعيد متابعة مسجلة للغد.'],subscriptions:['الاشتراكات','الاشتراكات التي يقترب موعد انتهائها.','لا توجد تنبيهات اشتراكات','لا توجد اشتراكات تنتهي خلال يومين أو أسبوع.']};
 const t=titles[activeTab];$('tabTitle').textContent=t[0];$('tabSubtitle').textContent=t[1];$('emptyTitle').textContent=t[2];$('emptyText').textContent=t[3];$('empty').classList.toggle('hidden',list.length>0);
 list.forEach(n=>{const el=document.createElement('div');el.className='card glass rounded-3xl p-4 sm:p-5';el.innerHTML=`<div class="flex items-start gap-4"><div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl ${n.box}"><i class="${n.icon}"></i></div><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><h3 class="font-extrabold text-slate-800">${esc(n.patientName)}</h3><span class="rounded-full px-2.5 py-1 text-[10px] font-bold ${n.box}">${esc(n.type)}</span></div><p class="mt-1 text-sm font-extrabold text-slate-700">${esc(n.title)}</p><p class="mt-1 text-sm leading-6 text-slate-500">${esc(n.text)}</p>${n.date?`<div class="mt-2 text-xs font-bold text-slate-400"><i class="fa-regular fa-calendar ml-1"></i>${fmt(n.date)}</div>`:''}</div></div>`;$('notifications').appendChild(el)});
}
async function load(){
 const{data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError||!session){location.replace('index.html');return}
 const{data,error}=await supabase.from('patient_finances').select('patient_id,subscription_end_date,next_follow_up_date,follow_up_days,patients(name)').eq('user_id',session.user.id);if(error)throw error;
 const today=new Date();const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
 (data||[]).forEach(row=>{
  if(row.next_follow_up_date){const d=daysUntil(row.next_follow_up_date,today);if(d===0)add(all.today,row,'متابعة اليوم','موعد المتابعة اليوم','المريض لديه موعد متابعة اليوم.','fa-solid fa-calendar-check','bg-sky-50 text-sky-700',row.next_follow_up_date);if(d===1)add(all.tomorrow,row,'متابعة الغد','موعد المتابعة غدًا','المريض لديه موعد متابعة غدًا.','fa-solid fa-calendar-plus','bg-indigo-50 text-indigo-700',row.next_follow_up_date)}
  if(row.subscription_end_date){const d=daysUntil(row.subscription_end_date,today);if(d===2)add(all.subscriptions,row,'ينتهي خلال يومين','الاشتراك يقترب من الانتهاء','يتبقى يومان على انتهاء الاشتراك.','fa-solid fa-triangle-exclamation','bg-red-50 text-red-700',row.subscription_end_date);if(d===7)add(all.subscriptions,row,'ينتهي خلال أسبوع','الاشتراك يقترب من الانتهاء','يتبقى أسبوع واحد على انتهاء الاشتراك.','fa-solid fa-calendar-days','bg-amber-50 text-amber-700',row.subscription_end_date)}
 });
 $('todayCount').textContent=all.today.length;$('tomorrowCount').textContent=all.tomorrow.length;$('subscriptionCount').textContent=all.subscriptions.length;render();$('loading').style.display='none';
}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.tab;document.querySelectorAll('.tab-btn').forEach(x=>{const on=x.dataset.tab===activeTab;x.classList.toggle('active',on);x.classList.toggle('text-slate-500',!on)});render()});
(async()=>{try{await load()}catch(e){console.error(e);$('loading').innerHTML=`<div class="rounded-2xl bg-white p-6 text-center shadow-sm"><div class="text-red-600 font-bold">تعذر تحميل الإشعارات</div><div class="mt-2 text-xs text-slate-400">${esc(e.message)}</div></div>`}})();
</script>
</body>
</html>
