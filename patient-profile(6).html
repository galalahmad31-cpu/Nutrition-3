<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملف المريض | Diet Planner | د. أحمد جلال</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body{font-family:'Cairo',sans-serif;background:#f8fafc;color:#0f172a}
    .module-card{transition:.18s ease}
    .bg-brand-500{background-color:#178f84}
    .module-card:hover{transform:translateY(-2px)}
    .visit-delete-icon{border:0!important;color:#64748b!important;font-size:1.15rem!important;width:auto!important;height:auto!important;margin:.1rem auto .65rem!important}
    .visit-delete-popup{border-radius:1.05rem!important;font-family:'Cairo',sans-serif!important;width:290px!important;padding:.85rem 1rem .7rem!important}
    .visit-delete-title{font-family:'Cairo',sans-serif!important;font-size:1rem!important;font-weight:800!important;margin:.1rem 0 .35rem!important}
    .visit-delete-text{font-family:'Cairo',sans-serif!important;font-size:.72rem!important;font-weight:500!important;color:#64748b!important;line-height:1.7!important;margin:0!important}
    .visit-delete-icon{border:0!important;color:#64748b!important;font-size:1rem!important;width:auto!important;height:auto!important;margin:.05rem auto .45rem!important}
    .visit-delete-confirm{border-radius:.65rem!important;font-family:'Cairo',sans-serif!important;font-weight:800!important;font-size:.75rem!important;padding:.55rem 1.2rem!important}
    .visit-delete-cancel{background:transparent!important;color:#64748b!important;box-shadow:none!important;font-family:'Cairo',sans-serif!important;font-weight:700!important;font-size:.75rem!important;padding:.55rem .8rem!important}
  </style>
</head>

<body class="min-h-screen">

<header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3 min-w-0">
      <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-leaf text-2xl"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-black text-lg leading-tight">Diet Planner</h1>
        <p class="text-xs font-bold text-emerald-400">د. أحمد جلال</p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <a href="app.html"
         class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
        لوحة التحكم
      </a>
      <a href="patient.html"
         class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
        ← قائمة المرضى
      </a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

  <!-- PATIENT HEADER -->
  <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
    <div id="loadingState" class="text-center py-8 text-sm text-slate-400">
      جاري تحميل ملف المريض...
    </div>

    <div id="patientContent" class="hidden">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

        <div class="flex items-center gap-3 min-w-0">
          <div class="w-14 h-14 shrink-0 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl">
            👤
          </div>

          <div class="min-w-0">
            <h2 id="patientName" class="font-black text-slate-800 text-xl"></h2>
          </div>
        </div>

        <button onclick="enableEditing()"
          id="editButton"
          class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl">
          تعديل بيانات المريض
        </button>
      </div>

      <!-- PATIENT DATA -->
      <details class="mt-5 pt-5 border-t border-slate-100">
        <summary class="cursor-pointer list-none flex items-center justify-between text-sm font-extrabold text-slate-600">
          <span>بيانات المريض</span>
          <span class="text-xs text-slate-400">عرض / إخفاء</span>
        </summary>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">اسم المريض</label>
          <input id="nameInput" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">النوع</label>
          <select id="genderInput" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70">
            <option value="">غير محدد</option>
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">تاريخ الميلاد</label>
          <input id="birthDateInput" type="date" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">العمر (سنة)</label>
          <input id="ageInput" type="number" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">الطول (سم)</label>
          <input id="heightInput" type="number" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">التشخيص الطبي</label>
          <textarea id="diagnosisInput" rows="2" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">شكوى / أعراض</label>
          <textarea id="complaintsInput" rows="2" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">ملاحظات سريرية</label>
          <textarea id="notesInput" rows="2" disabled
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold disabled:opacity-70"></textarea>
        </div>
        </div>
      </details>

      <div id="saveArea" class="hidden flex justify-end gap-2 mt-4 pt-4 border-t border-slate-100">
        <button onclick="savePatient()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-5 py-2.5 rounded-xl">
          حفظ التعديلات
        </button>
        <button onclick="cancelEditing()"
          class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-4 py-2.5 rounded-xl">
          إلغاء
        </button>
      </div>
    </div>

    <div id="errorState" class="hidden text-center py-8">
      <div class="text-3xl mb-3">⚠️</div>
      <p id="errorText" class="text-sm font-bold text-red-600"></p>
      <a href="patient.html"
        class="inline-block mt-4 bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold">
        العودة لقائمة المرضى
      </a>
    </div>
  </section>

  <!-- VISITS -->
  <section id="modulesSection" class="hidden mt-6">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div>
          <h3 class="font-black text-slate-800 text-lg">زيارات المريض</h3>
          <p class="text-xs text-slate-400 mt-1">سجل الزيارات الغذائية للمريض.</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" onclick="addVisit()"
            class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl transition">
            ＋ إضافة زيارة
          </button>
        </div>
      </div>

      <div id="visitsLoading" class="text-center py-5 text-xs text-slate-400">جاري تحميل الزيارات...</div>
      <div id="visitsEmpty" class="hidden text-center py-6 text-xs text-slate-400">لا توجد زيارات حتى الآن.</div>
      <div id="visitsList" class="space-y-2"></div>
    </div>

    <a id="weightLink" class="module-card block mt-4 bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:border-sky-300 hover:shadow-md">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 shrink-0 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">📈</div>
        <div>
          <h4 class="font-black text-slate-800">متابعة الوزن</h4>
          <p class="text-[11px] text-slate-400 mt-1">تسجيل قياسات الوزن ومتابعة التغير.</p>
        </div>
      </div>
    </a>
  </section>

</main>

<script>
  // =========================================================
  // PATIENT PROFILE
  // Standalone page.
  // Patient context is passed only through ?id=PATIENT_ID.
  // =========================================================

  const SUPABASE_URL = "https://zwxnmnfoknfbzvptnpmv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const patientId = new URLSearchParams(window.location.search).get('id');

  let patient = null;

  function setLink(id, page) {
    document.getElementById(id).href =
      page + '?id=' + encodeURIComponent(patientId);
  }

  function showError(message) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('patientContent').classList.add('hidden');
    document.getElementById('modulesSection').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorText').textContent = message;
  }

  async function getCurrentUser() {
    const { data, error } = await db.auth.getUser();
    if (error) return null;
    return data?.user || null;
  }

  async function loadPatient() {
    if (!patientId) {
      showError('لم يتم تحديد المريض.');
      return;
    }

    const user = await getCurrentUser();

    if (!user) {
      showError('يجب تسجيل الدخول أولاً.');
      return;
    }

    const { data, error } = await db
      .from('patients')
      .select('id,user_id,name,gender,birth_date,age,height,diagnosis,complaints,clinical_notes,created_at,updated_at')
      .eq('id', patientId)
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) {
      console.error(error);
      showError('تعذر تحميل ملف المريض.');
      return;
    }

    if (!data) {
      showError('ملف المريض غير موجود أو لا تملك صلاحية الوصول إليه.');
      return;
    }

    patient = data;
    fillPatientData();

    setLink('weightLink', 'weight.html');
    loadVisits(user.id);

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('patientContent').classList.remove('hidden');
    document.getElementById('modulesSection').classList.remove('hidden');
  }


  async function loadVisits(userId) {
    const loading = document.getElementById('visitsLoading');
    const empty = document.getElementById('visitsEmpty');
    const list = document.getElementById('visitsList');

    loading.classList.remove('hidden');
    empty.classList.add('hidden');
    list.innerHTML = '';

    const { data, error } = await db
      .from('patient_visits')
      .select('id,visit_number,visit_date')
      .eq('patient_id', patientId)
      .eq('user_id', userId)
      .order('visit_number', { ascending: false });

    loading.classList.add('hidden');

    if (error) {
      console.error(error);
      list.innerHTML = '<div class="text-center py-5 text-xs font-bold text-red-500">تعذر تحميل الزيارات.</div>';
      return;
    }

    if (!data || data.length === 0) {
      empty.classList.remove('hidden');
      return;
    }

    data.forEach(visit => {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-white hover:border-emerald-300 px-4 py-3 transition';

      const visitLink = document.createElement('a');
      visitLink.href = 'visit.html?id=' + encodeURIComponent(visit.id);
      visitLink.className = 'flex items-center gap-3 min-w-0 flex-1';
      visitLink.innerHTML = `
        <div class="w-10 h-10 shrink-0 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-sm">${visit.visit_number}</div>
        <div class="min-w-0">
          <div class="font-extrabold text-sm text-slate-800">زيارة رقم ${visit.visit_number}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">${formatVisitDate(visit.visit_date)}</div>
        </div>
      `;

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'shrink-0 w-9 h-9 rounded-xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition flex items-center justify-center';
      deleteButton.title = 'حذف الزيارة';
      deleteButton.setAttribute('aria-label', 'حذف الزيارة');
      deleteButton.innerHTML = '<i class="fa-solid fa-trash"></i>';
      deleteButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        deleteVisit(visit);
      });

      row.appendChild(visitLink);
      row.appendChild(deleteButton);
      list.appendChild(row);
    });
  }

  function formatVisitDate(date) {
    if (!date) return 'بدون تاريخ';
    const d = new Date(date + 'T00:00:00');
    return new Intl.DateTimeFormat('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }).format(d);
  }

  async function deleteVisit(visit) {
    const result = await Swal.fire({
      iconHtml: '<i class="fa-solid fa-trash"></i>',
      title: 'حذف الزيارة',
      text: `هل أنت متأكد من حذف الزيارة رقم ${visit.visit_number}؟`,
      showCancelButton: true,
      confirmButtonText: 'حذف',
      cancelButtonText: 'إلغاء',
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#ffffff',
      reverseButtons: true,
      width: '290px',
      padding: '.85rem 1rem .7rem',
      customClass: {
        popup: 'visit-delete-popup',
        title: 'visit-delete-title',
        htmlContainer: 'visit-delete-text',
        icon: 'visit-delete-icon',
        confirmButton: 'visit-delete-confirm',
        cancelButton: 'visit-delete-cancel'
      },
      buttonsStyling: true
    });

    if (!result.isConfirmed) return;

    const user = await getCurrentUser();
    if (!user) {
      await Swal.fire({ title: 'تنبيه', text: 'يجب تسجيل الدخول أولاً.', icon: 'info', confirmButtonText: 'حسنًا', confirmButtonColor: '#178f84' });
      return;
    }

    const { error } = await db
      .from('patient_visits')
      .delete()
      .eq('id', visit.id)
      .eq('patient_id', patientId)
      .eq('user_id', user.id);

    if (error) {
      console.error(error);
      await Swal.fire({ title: 'تعذر الحذف', text: 'حدث خطأ أثناء حذف الزيارة.', icon: 'error', confirmButtonText: 'حسنًا', confirmButtonColor: '#178f84' });
      return;
    }

    await loadVisits(user.id);
  }

  async function addVisit() {
    const user = await getCurrentUser();
    if (!user) {
      alert('يجب تسجيل الدخول أولاً.');
      return;
    }

    const { data: lastVisit, error: lastError } = await db
      .from('patient_visits')
      .select('visit_number')
      .eq('patient_id', patientId)
      .eq('user_id', user.id)
      .order('visit_number', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (lastError) {
      console.error(lastError);
      alert('تعذر معرفة رقم الزيارة التالية.');
      return;
    }

    const nextNumber = (lastVisit?.visit_number || 0) + 1;

    const { data: visit, error } = await db
      .from('patient_visits')
      .insert({
        patient_id: patientId,
        user_id: user.id,
        visit_number: nextNumber,
        visit_date: new Date().toISOString().slice(0, 10)
      })
      .select('id')
      .single();

    if (error) {
      console.error(error);
      alert('تعذر إنشاء الزيارة.');
      return;
    }

    window.location.href = 'visit.html?id=' + encodeURIComponent(visit.id);
  }

  function fillPatientData() {
    document.getElementById('patientName').textContent = patient.name || 'بدون اسم';

    document.getElementById('nameInput').value = patient.name || '';
    document.getElementById('genderInput').value = patient.gender || '';
    document.getElementById('birthDateInput').value = patient.birth_date || '';
    document.getElementById('ageInput').value = patient.age ?? '';
    document.getElementById('heightInput').value = patient.height ?? '';
    document.getElementById('diagnosisInput').value = patient.diagnosis || '';
    document.getElementById('complaintsInput').value = patient.complaints || '';
    document.getElementById('notesInput').value = patient.clinical_notes || '';
  }

  function enableEditing() {
    [
      'nameInput',
      'genderInput',
      'birthDateInput',
      'ageInput',
      'heightInput',
      'diagnosisInput',
      'complaintsInput',
      'notesInput'
    ].forEach(id => {
      document.getElementById(id).disabled = false;
    });

    document.getElementById('saveArea').classList.remove('hidden');
    document.getElementById('editButton').classList.add('hidden');
  }

  function cancelEditing() {
    fillPatientData();

    [
      'nameInput',
      'genderInput',
      'birthDateInput',
      'ageInput',
      'heightInput',
      'diagnosisInput',
      'complaintsInput',
      'notesInput'
    ].forEach(id => {
      document.getElementById(id).disabled = true;
    });

    document.getElementById('saveArea').classList.add('hidden');
    document.getElementById('editButton').classList.remove('hidden');
  }

  async function savePatient() {
    const user = await getCurrentUser();

    if (!user) {
      alert('يجب تسجيل الدخول أولاً.');
      return;
    }

    const payload = {
      name: document.getElementById('nameInput').value.trim() || 'مريض',
      gender: document.getElementById('genderInput').value || null,
      birth_date: document.getElementById('birthDateInput').value || null,
      age: document.getElementById('ageInput').value !== ''
        ? Number(document.getElementById('ageInput').value)
        : null,
      height: document.getElementById('heightInput').value !== ''
        ? Number(document.getElementById('heightInput').value)
        : null,
      diagnosis: document.getElementById('diagnosisInput').value.trim() || null,
      complaints: document.getElementById('complaintsInput').value.trim() || null,
      clinical_notes: document.getElementById('notesInput').value.trim() || null
    };

    const { data, error } = await db
      .from('patients')
      .update(payload)
      .eq('id', patientId)
      .eq('user_id', user.id)
      .select('*')
      .single();

    if (error) {
      console.error(error);
      alert('تعذر حفظ تعديلات المريض.');
      return;
    }

    patient = data;
    cancelEditing();
  }

  document.addEventListener('DOMContentLoaded', loadPatient);
</script>

</body>
</html>
