<!DOCTYPE html>
<html lang="en">
<head>

        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; }
        .sidebar { width: 240px; background: #1e293b; color: white; min-height: 100vh; }
        .sidebar a { display: flex; align-items: center; padding: 12px 16px; color: #cbd5e1; }

        .btn { font-weight: 600; border-radius: 8px; padding: 10px 20px; }
        .tab-btn { cursor: pointer; padding: 10px 16px; border-bottom: 3px solid transparent; flex: 1; text-align: center; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .ltr { direction: ltr !important; text-align: left !important; }
    </style>
</head>
<body class="flex">

    <div class="sidebar flex flex-col shrink-0">

        <nav class="flex-1 mt-4" id="sidebar-nav">
            <a href="#" data-page="home" class="active">🏠 Home</a>
            <a href="#" data-page="patients">👥 Patients</a>

    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto p-6" id="main-content">
        <!-- Dynamic page content loaded here -->
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full font-bold text-sm opacity-0 transition-opacity pointer-events-none z-50"></div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
