<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NICU Nutrition - Dr. Ahmed Galal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f1f5f9; }
    .sidebar { width: 250px; background: #1e293b; color: white; min-height: 100vh; }
    .sidebar a { display: flex; align-items: center; padding: 12px 16px; color: #cbd5e1; text-decoration: none; }
    .sidebar a.active, .sidebar a:hover { background: #334155; color: white; }
    input, select, textarea { border: 1px solid #cbd5e0; padding: 8px; border-radius: 6px; width: 100%; }
    .btn { font-weight: 600; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
    .tab-btn { cursor: pointer; padding: 10px 16px; border-bottom: 3px solid transparent; flex: 1; text-align: center; background: #f1f5f9; }
    .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .ltr { direction: ltr !important; text-align: left !important; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 12px 28px; border-radius: 999px; font-weight: bold; font-size: 0.9rem; z-index: 9999; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.success { background: #065f46; color: white; }
    .toast.error { background: #991b1b; color: white; }
    .toast.loading { background: #1e3a8a; color: white; }
  </style>
</head>
<body class="flex">
  <!-- Sidebar -->
  <div class="sidebar shrink-0">
    <div class="p-4 text-2xl font-bold border-b border-slate-700">NICU Nutrition</div>
    <nav id="sidebar-nav" class="flex-1 mt-4">
      <a href="#" data-page="home" class="active">🏠 Home</a>
      <a href="#" data-page="patients">👥 Patients</a>
      <a href="#" data-page="reference">📚 Reference</a>
      <a href="#" data-page="profile">👤 Profile</a>
      <a href="#" id="btn-signout">🚪 Sign Out</a>
    </nav>
  </div>

  <!-- Main -->
  <div id="main-content" class="flex-1 p-6 overflow-auto"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
