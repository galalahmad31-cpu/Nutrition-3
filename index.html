<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بناء الدايت | Diet Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:Cairo,sans-serif;background:#f4f7f9;color:#0f172a}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.055)}
.input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;outline:0;transition:.2s}
.input:focus{background:#fff;border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.10)}
.btn{border-radius:12px;padding:9px 13px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;cursor:pointer}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.day-btn{border:1px solid #e2e8f0;background:#fff;color:#64748b;border-radius:13px;padding:10px 16px;font-size:11px;font-weight:900;white-space:nowrap;transition:.18s}
.day-btn.active{background:#0f766e;color:#fff;border-color:#0f766e;box-shadow:0 8px 20px rgba(15,118,110,.18)}
.meal{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:visible;box-shadow:0 4px 18px rgba(15,23,42,.035)}
.meal-head{background:linear-gradient(180deg,#fbfdfd,#f8fafc);border-bottom:1px solid #eef2f7}
.item-row{border-bottom:1px solid #f1f5f9}.item-row:last-child{border-bottom:0}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:12px}
.progress{height:7px;background:#edf2f3;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#059669,#14b8a6)}
.food-picker{position:relative}.food-menu{position:absolute;z-index:40;top:calc(100% + 7px);right:0;left:0;background:#fff;border:1px solid #dfe7ea;border-radius:16px;box-shadow:0 22px 55px rgba(15,23,42,.16);overflow:hidden;display:none}
.food-menu.open{display:block}.food-results{max-height:260px;overflow:auto}.food-option{padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:.12s}.food-option:hover{background:#f0fdf4}.food-option:last-child{border-bottom:0}
.food-search{padding:10px;background:#f8fafc;border-bottom:1px solid #eef2f7}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;font-size:9px;font-weight:900}
.hero{background:radial-gradient(circle at 10% 0%,rgba(45,212,191,.22),transparent 30%),linear-gradient(135deg,#0f172a 0%,#123b3b 55%,#047857 100%);color:#fff}
.target-card{border:1px solid rgba(16,185,129,.18);background:linear-gradient(180deg,#ffffff,#f8fffc)}
.summary-card{background:linear-gradient(135deg,#064e3b,#0f766e);color:#fff}
.goal-input{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.15)!important;color:#fff!important}
.goal-input::placeholder{color:#cbd5e1}
.goal-input:focus{background:rgba(255,255,255,.14)!important;border-color:#6ee7b7!important;box-shadow:0 0 0 4px rgba(110,231,183,.10)!important}
.modal{background:#fff;border-radius:22px;width:min(1050px,96vw);max-height:92vh;overflow:hidden;box-shadow:0 30px 90px rgba(15,23,42,.28)}
@media(max-width:640px){.hero{border-radius:18px}.food-menu{position:fixed;right:4vw;left:4vw;top:auto}.meal{border-radius:15px}}
</style>
</head>
<body class="min-h-screen">
<iframe id="libFrame" src="lib.html" class="hidden" aria-hidden="true"></iframe>

<header class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur border-b border-white/10 text-white">
 <div class="max-w-[1500px] mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
  <div class="flex items-center gap-3 min-w-0">
   <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center shadow-lg shadow-emerald-950/40 shrink-0"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i></div>
   <div class="min-w-0"><h1 class="font-black text-base sm:text-lg truncate">بناء الدايت</h1><p class="text-[10px] text-emerald-300 font-bold truncate">Professional Diet Builder</p></div>
  </div>
  <div class="flex gap-2 shrink-0">
   <button class="btn bg-white/10 hover:bg-white/15 text-white" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i><span class="hidden sm:inline">الرجوع</span></button>
   <button class="btn bg-emerald-500 hover:bg-emerald-400 text-white" onclick="openCodeModal()"><i class="fa-solid fa-code"></i><span>توليد الكود</span></button>
  </div>
 </div>
</header>

<main class="max-w-[1500px] mx-auto px-3 sm:px-5 py-4 sm:py-5 space-y-4">
 <!-- TOP HERO: NAME + TARGETS + CURRENT TOTAL -->
 <section class="hero rounded-[22px] p-4 sm:p-5 shadow-xl">
  <div class="flex flex-col xl:flex-row xl:items-end gap-5">
   <div class="xl:w-[34%]">
    <div class="flex items-center gap-2 text-emerald-200 text-[10px] font-black mb-2"><i class="fa-solid fa-bullseye"></i> هوية الدايت</div>
    <input id="dietName" class="input goal-input text-base !py-3.5" placeholder="اسم الدايت — مثال: دايت 1800 سعر">
    <input id="dietDescription" class="input goal-input mt-2" placeholder="وصف مختصر — مثال: 3 وجبات رئيسية + 2 سناك">
   </div>
   <div class="flex-1 grid grid-cols-2 sm:grid-cols-4 gap-2.5">
    <div><label class="block text-[9px] font-black text-amber-200 mb-1.5">السعرات المستهدفة / يوم</label><input id="targetCal" type="number" value="1800" class="input goal-input !font-black text-center" oninput="renderAll()"></div>
    <div><label class="block text-[9px] font-black text-emerald-100 mb-1.5">Protein %</label><input id="targetPro" type="number" value="20" class="input goal-input !font-black text-center" oninput="renderAll()"></div>
    <div><label class="block text-[9px] font-black text-emerald-100 mb-1.5">Carbohydrate %</label><input id="targetCarb" type="number" value="60" class="input goal-input !font-black text-center" oninput="renderAll()"></div>
    <div><label class="block text-[9px] font-black text-emerald-100 mb-1.5">Fat %</label><input id="targetFat" type="number" value="20" class="input goal-input !font-black text-center" oninput="renderAll()"></div>
   </div>
  </div>
 </section>

 <!-- TOP DAILY SUMMARY -->
 <section class="card p-3 sm:p-4">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
   <div><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center"><i class="fa-solid fa-chart-simple"></i></span><div><h2 class="font-black text-sm text-slate-800">المجمل اليومي</h2><p id="summarySub" class="text-[9px] text-slate-400 font-bold">اليوم الحالي</p></div></div></div>
   <div id="macroValidity" class="text-[10px] font-black px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700">الماكروز = 100%</div>
  </div>
  <div id="summaryTop" class="grid grid-cols-2 lg:grid-cols-7 gap-2"></div>
 </section>

 <!-- DAYS -->
 <section class="flex items-center gap-2 overflow-x-auto pb-1" id="daysBar"></section>

 <section class="card overflow-visible">
  <div class="bg-slate-950 text-white p-4 sm:p-5 rounded-t-[20px]">
   <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
     <div class="flex items-center gap-2">
      <span id="dayBadge" class="w-8 h-8 rounded-xl bg-emerald-600 flex items-center justify-center text-xs font-black">1</span>
      <input id="dayTitle" class="bg-transparent border-b border-white/15 focus:border-emerald-400 outline-none font-black text-base px-1 py-1" value="اليوم 1" onchange="updateDayTitle(this.value)">
     </div>
     <p class="text-[10px] text-slate-400 mt-1">أضف الوجبات والأصناف، وحدد الكمية والتكرار الأسبوعي لكل صنف.</p>
    </div>
    <div class="flex gap-2">
     <button class="btn bg-white/10 hover:bg-white/15 text-white" onclick="addDay()"><i class="fa-solid fa-plus"></i> يوم جديد</button>
     <button class="btn bg-rose-500/10 hover:bg-rose-500/20 text-rose-200" onclick="removeDay()"><i class="fa-solid fa-trash"></i> حذف</button>
    </div>
   </div>
  </div>
  <div id="mealsArea" class="p-3 sm:p-4 space-y-4"></div>
  <div class="px-3 sm:px-4 pb-4"><button class="btn w-full border-2 border-dashed border-emerald-200 text-emerald-700 bg-emerald-50/50 hover:bg-emerald-50 py-3.5" onclick="addMeal()"><i class="fa-solid fa-plus"></i> إضافة وجبة جديدة</button></div>
 </section>
</main>

<div id="codeModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm hidden items-center justify-center p-3 z-[100]" onclick="if(event.target===this)closeCodeModal()">
 <div class="modal">
  <div class="p-4 bg-slate-950 text-white flex justify-between items-center gap-3"><div><h3 class="font-black text-sm">الكود الجاهز لـ meals.html</h3><p class="text-[10px] text-slate-400 mt-1">انسخه داخل ملف meals.html داخل FIXED_MEALS</p></div><button onclick="closeCodeModal()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div>
  <div class="p-4"><div class="flex gap-2 mb-3"><button class="btn bg-emerald-600 text-white" onclick="copyCode()"><i class="fa-solid fa-copy"></i> نسخ الكود</button><button class="btn bg-slate-100 text-slate-700" onclick="generateCode()"><i class="fa-solid fa-rotate"></i> تحديث</button></div><textarea id="code" class="w-full h-[58vh] bg-slate-950 text-slate-100 rounded-xl p-4 font-mono text-xs leading-6 outline-none" dir="ltr" spellcheck="false"></textarea></div>
 </div>
</div>
<div id="toast" class="fixed bottom-5 left-5 z-[120] hidden bg-slate-950 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold"></div>

<script>
let FOOD_LIBRARY=[],days=[],activeDay=0,seq=0;
const $=id=>document.getElementById(id);
const uid=()=>`b_${Date.now()}_${++seq}_${Math.random().toString(36).slice(2,7)}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const fmt=v=>Number.isInteger(n(v))?String(n(v)):n(v).toFixed(1);
const pct=(v,total)=>total>0?Math.min(100,Math.max(0,v/total*100)):0;

function meal(name){return{id:uid(),name,description:'',items:[]}}
function day(){return{id:uid(),title:`اليوم ${days.length+1}`,notes:'',meals:[meal('الفطار'),meal('سناك 1'),meal('الغداء'),meal('سناك 2'),meal('العشاء')]}}
function init(){days=[day()];renderAll()}

function targets(){
 const cal=Math.max(0,n($('targetCal').value)),p=Math.max(0,n($('targetPro').value)),c=Math.max(0,n($('targetCarb').value)),f=Math.max(0,n($('targetFat').value));
 return{cal,pPct:p,cPct:c,fPct:f,sum:p+c+f,pro:cal*p/400,carb:cal*c/400,fat:cal*f/900};
}
function mealTotals(m){return m.items.reduce((t,it)=>{const f=FOOD_LIBRARY.find(x=>x.id===it.foodId),g=n(it.grams);if(!f)return t;t.calories+=n(f.calories)*g/100;t.protein+=n(f.protein)*g/100;t.carbs+=n(f.carbs)*g/100;t.fat+=n(f.fat)*g/100;t.sodium+=n(f.sodium)*g/100;t.potassium+=n(f.potassium)*g/100;t.phosphorus+=n(f.phosphorus)*g/100;return t},{calories:0,protein:0,carbs:0,fat:0,sodium:0,potassium:0,phosphorus:0})}
function dayTotals(d){return d.meals.reduce((a,m)=>{const t=mealTotals(m);Object.keys(a).forEach(k=>a[k]+=t[k]||0);return a},{calories:0,protein:0,carbs:0,fat:0,sodium:0,potassium:0,phosphorus:0})}

function renderAll(){renderDays();renderMeals();renderSummary()}
function renderDays(){
 $('daysBar').innerHTML=days.map((d,i)=>`<button class="day-btn ${i===activeDay?'active':''}" onclick="activeDay=${i};renderAll()"><i class="fa-solid fa-calendar-day ml-1"></i>${esc(d.title)}</button>`).join('')+
 `<button class="btn bg-emerald-50 text-emerald-700 border border-emerald-200" onclick="addDay()"><i class="fa-solid fa-plus"></i> يوم</button>`;
 $('dayBadge').textContent=activeDay+1;$('dayTitle').value=days[activeDay].title;
}
function updateDayTitle(v){days[activeDay].title=v.trim()||`اليوم ${activeDay+1}`;renderDays();renderSummary()}
function addDay(){if(days.length>=31)return toast('الحد الأقصى 31 يوم');days.push(day());activeDay=days.length-1;renderAll()}
function removeDay(){if(days.length===1)return toast('لا يمكن حذف اليوم الوحيد');if(!confirm('حذف اليوم الحالي؟'))return;days.splice(activeDay,1);activeDay=Math.max(0,activeDay-1);renderAll()}

function repeatOptions(v='7/7'){return['7/7','7/6','7/5','7/4','7/3','7/2','7/1'].map(x=>`<option value="${x}" ${v===x?'selected':''}>${x}</option>`).join('')}

function foodOptionHTML(f){
 return `<div class="food-option" onclick="addFoodFromPicker(this)" data-food-id="${esc(f.id)}">
   <div class="flex items-center justify-between gap-2">
    <div class="min-w-0"><div class="font-black text-[11px] text-slate-800 truncate">${esc(f.name)}</div><div class="text-[8px] text-slate-400 mt-0.5">${esc(f.id)}</div></div>
    <span class="text-[9px] font-black text-emerald-700 whitespace-nowrap">${fmt(f.calories)} kcal</span>
   </div>
   <div class="flex flex-wrap gap-1 mt-2">
    <span class="chip bg-slate-100 text-slate-600">P ${fmt(f.protein)}g</span><span class="chip bg-amber-50 text-amber-700">C ${fmt(f.carbs)}g</span><span class="chip bg-rose-50 text-rose-700">F ${fmt(f.fat)}g</span>
    <span class="chip bg-sky-50 text-sky-700">Na ${fmt(f.sodium)}mg</span><span class="chip bg-emerald-50 text-emerald-700">K ${fmt(f.potassium)}mg</span>
   </div>
 </div>`;
}
function mealPicker(mi){
 return `<div class="food-picker">
   <div class="relative">
    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
    <input class="input !bg-white !pr-9 !py-3" placeholder="ابحث عن صنف من المكتبة..." onfocus="openFoodPicker(${mi})" oninput="filterFoodPicker(${mi},this.value)" autocomplete="off">
   </div>
   <div id="foodMenu_${mi}" class="food-menu">
    <div class="food-search flex items-center justify-between gap-2"><span class="text-[9px] font-black text-slate-500">مكتبة الأغذية</span><span class="text-[9px] font-bold text-emerald-600">${FOOD_LIBRARY.length} صنف</span></div>
    <div id="foodResults_${mi}" class="food-results">${FOOD_LIBRARY.slice(0,80).map(foodOptionHTML).join('')}</div>
   </div>
 </div>`;
}
let pickerMeal=null;
function openFoodPicker(mi){pickerMeal=mi;document.querySelectorAll('.food-menu').forEach(x=>x.classList.remove('open'));const m=$(`foodMenu_${mi}`);if(m)m.classList.add('open')}
function filterFoodPicker(mi,q){
 const m=$(`foodMenu_${mi}`);if(!m)return;m.classList.add('open');pickerMeal=mi;
 const term=String(q||'').trim().toLowerCase();const arr=FOOD_LIBRARY.filter(f=>!term||String(f.name).toLowerCase().includes(term)||String(f.id).toLowerCase().includes(term)).slice(0,100);
 $(`foodResults_${mi}`).innerHTML=arr.length?arr.map(foodOptionHTML).join(''):`<div class="p-6 text-center text-xs font-bold text-slate-400">لا توجد نتائج مطابقة</div>`;
}
function addFoodFromPicker(el){const id=el.dataset.foodId;if(!id||pickerMeal===null)return;addFood(pickerMeal,id);pickerMeal=null}
document.addEventListener('click',e=>{if(!e.target.closest('.food-picker'))document.querySelectorAll('.food-menu').forEach(x=>x.classList.remove('open'))});

function renderMeals(){
 const d=days[activeDay];
 $('mealsArea').innerHTML=d.meals.map((m,mi)=>{const t=mealTotals(m);return `<article class="meal">
  <div class="meal-head p-3 sm:p-4">
   <div class="flex flex-col lg:flex-row lg:items-center gap-2.5">
    <div class="flex items-center gap-2 flex-1 min-w-0"><span class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px] font-black shrink-0">${mi+1}</span><input class="input !bg-white !font-black" value="${esc(m.name)}" onchange="updateMeal(${mi},'name',this.value)" placeholder="اسم الوجبة"><input class="input !bg-white !font-semibold !text-slate-500 hidden lg:block" value="${esc(m.description)}" onchange="updateMeal(${mi},'description',this.value)" placeholder="وصف مختصر للوجبة"></div>
    <div class="flex gap-1 justify-end"><button class="btn !p-2 bg-white border border-slate-200 text-slate-500" onclick="moveMeal(${mi},-1)" title="أعلى"><i class="fa-solid fa-chevron-up"></i></button><button class="btn !p-2 bg-white border border-slate-200 text-slate-500" onclick="moveMeal(${mi},1)" title="أسفل"><i class="fa-solid fa-chevron-down"></i></button><button class="btn !p-2 bg-white border border-rose-100 text-rose-500" onclick="deleteMeal(${mi})" title="حذف"><i class="fa-solid fa-trash"></i></button></div>
   </div>
  </div>
  <div class="px-3 sm:px-4">${m.items.length?m.items.map((it,ii)=>itemRow(it,mi,ii)).join(''):`<div class="py-7 text-center"><div class="w-10 h-10 rounded-xl bg-slate-50 text-slate-300 flex items-center justify-center mx-auto mb-2"><i class="fa-solid fa-utensils"></i></div><div class="text-[10px] text-slate-400 font-bold">ابدأ باختيار صنف من مكتبة الأغذية</div></div>`}</div>
  <div class="p-3 sm:p-4 bg-slate-50 border-t border-slate-100 rounded-b-[18px]">
   <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_150px_125px] gap-2 items-center">
    ${mealPicker(mi)}
    <div class="rounded-xl bg-white border border-slate-200 p-2.5 text-center"><div class="text-[9px] text-slate-400 font-bold">مجمل الوجبة</div><b class="text-sm text-slate-800">${fmt(t.calories)} <span class="text-[9px] text-slate-400">kcal</span></b><div class="text-[8px] text-slate-400 mt-0.5">P ${fmt(t.protein)} · C ${fmt(t.carbs)} · F ${fmt(t.fat)}</div></div>
    <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-2.5 text-center"><div class="text-[9px] text-emerald-600 font-bold">عدد الأصناف</div><b class="text-sm text-emerald-800">${m.items.length}</b></div>
   </div>
  </div>
 </article>`}).join('');
}
function itemRow(it,mi,ii){
 const f=FOOD_LIBRARY.find(x=>x.id===it.foodId);if(!f)return'';const g=n(it.grams);
 return `<div class="item-row py-3.5 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_110px_120px_125px_38px] gap-2.5 items-center">
  <div class="min-w-0"><div class="font-black text-[11px] text-slate-800">${esc(f.name)}</div><div class="text-[8px] text-slate-400 mt-1 flex flex-wrap gap-x-2 gap-y-1"><span>${esc(f.id)}</span><span>${fmt(f.calories)} kcal/100g</span><span>P ${fmt(f.protein)}</span><span>C ${fmt(f.carbs)}</span><span>F ${fmt(f.fat)}</span></div></div>
  <div><label class="block text-[8px] font-black text-slate-400 mb-1">الكمية (g)</label><input class="input !py-2 text-center" type="number" min="0" step="1" value="${g}" onchange="updateItem(${mi},${ii},'grams',this.value)"></div>
  <div><label class="block text-[8px] font-black text-slate-400 mb-1">التكرار الأسبوعي</label><select class="input !py-2" onchange="updateItem(${mi},${ii},'repeat',this.value)">${repeatOptions(it.repeat||'7/7')}</select></div>
  <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-2 text-center"><div class="text-[8px] text-emerald-600 font-bold">قيمة الكمية</div><b class="text-xs text-emerald-800">${fmt(f.calories*g/100)} kcal</b></div>
  <button class="btn !p-2 text-rose-400 hover:bg-rose-50" onclick="removeItem(${mi},${ii})"><i class="fa-solid fa-xmark"></i></button>
 </div>`;
}
function addFood(mi,id){if(!id)return;days[activeDay].meals[mi].items.push({itemId:uid(),foodId:id,grams:100,repeat:'7/7'});renderAll()}
function updateItem(mi,ii,key,v){const it=days[activeDay].meals[mi].items[ii];if(!it)return;it[key]=key==='grams'?Math.max(0,n(v)):v;renderAll()}
function removeItem(mi,ii){days[activeDay].meals[mi].items.splice(ii,1);renderAll()}
function updateMeal(i,key,v){days[activeDay].meals[i][key]=v}
function addMeal(){days[activeDay].meals.push(meal('وجبة جديدة'));renderAll()}
function deleteMeal(i){if(!confirm('حذف هذه الوجبة؟'))return;days[activeDay].meals.splice(i,1);renderAll()}
function moveMeal(i,d){const j=i+d;if(j<0||j>=days[activeDay].meals.length)return;const a=days[activeDay].meals;[a[i],a[j]]=[a[j],a[i]];renderAll()}

function renderSummary(){
 const x=targets(),t=dayTotals(days[activeDay]),total=x.sum;
 $('summarySub').textContent=`${days[activeDay].title} • ${days[activeDay].meals.length} وجبات`;
 $('macroValidity').className=`text-[10px] font-black px-3 py-1.5 rounded-full ${total===100?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`;
 $('macroValidity').textContent=total===100?'الماكروز = 100%':`مجموع الماكروز = ${fmt(total)}%`;
 const cards=[
  ['السعرات',t.calories,x.cal,'kcal','fa-fire-flame-curved','amber'],
  ['البروتين',t.protein,x.pro,'g','fa-dumbbell','emerald'],
  ['الكارب',t.carbs,x.carb,'g','fa-bread-slice','sky'],
  ['الدهون',t.fat,x.fat,'g','fa-droplet','rose'],
  ['الصوديوم',t.sodium,null,'mg','fa-flask','sky'],
  ['البوتاسيوم',t.potassium,null,'mg','fa-bolt','emerald'],
  ['الفوسفور',t.phosphorus,null,'mg','fa-atom','violet']
 ];
 $('summaryTop').innerHTML=cards.map(c=>{const [label,val,target,unit,icon,clr]=c;const p=target?pct(val,target):null;const rem=target?target-val:null;return `<div class="kpi"><div class="flex items-center justify-between gap-1"><span class="text-[9px] font-black text-slate-400">${label}</span><span class="w-6 h-6 rounded-lg bg-${clr}-50 text-${clr}-600 flex items-center justify-center"><i class="fa-solid ${icon} text-[9px]"></i></span></div><div class="mt-1 font-black text-sm text-slate-800">${fmt(val)} <span class="text-[8px] text-slate-400">${unit}</span></div>${target?`<div class="text-[8px] text-slate-400 mt-0.5">الهدف ${fmt(target)} ${unit}</div><div class="progress mt-2"><i style="width:${p}%"></i></div><div class="text-[8px] ${rem>=0?'text-slate-400':'text-rose-500'} mt-1">${rem>=0?'متبقي: '+fmt(rem):'زيادة: '+fmt(Math.abs(rem))} ${unit}</div>`:`<div class="text-[8px] text-slate-400 mt-2">إجمالي اليوم</div>`}</div>`}).join('');
}

function generateCode(){
 const name=$('dietName').value.trim()||`دايت ${days.length} يوم`,desc=$('dietDescription').value.trim();
 let lines=['const FIXED_MEALS = ['];
 days.forEach((d,di)=>{const t=dayTotals(d);lines.push('  {',`    name: ${JSON.stringify(days.length===1?name:`${name} - ${d.title}`)},`,`    description: ${JSON.stringify(`${desc}${desc?' | ':''}إجمالي اليوم: ${fmt(t.calories)} kcal`)},`,'    meals: [');
  d.meals.forEach((m,mi)=>{lines.push('      {',`        name: ${JSON.stringify(m.name||'وجبة')},`,`        description: ${JSON.stringify(m.description||'')},`,'        items: [');
   m.items.forEach((it,ii)=>lines.push(`          { foodId: ${JSON.stringify(it.foodId)}, grams: ${n(it.grams)}, repeat: ${JSON.stringify(it.repeat||'7/7')} }${ii<m.items.length-1?',':''}`));
   lines.push(`        ]\n      }${mi<d.meals.length-1?',':''}`)});
  lines.push(`    ]\n  }${di<days.length-1?',':''}`)});
 lines.push('];');$('code').value=lines.join('\n');
}
function openCodeModal(){generateCode();$('codeModal').classList.remove('hidden');$('codeModal').classList.add('flex')}
function closeCodeModal(){$('codeModal').classList.add('hidden');$('codeModal').classList.remove('flex')}
async function copyCode(){generateCode();try{await navigator.clipboard.writeText($('code').value)}catch(e){$('code').select();document.execCommand('copy')}toast('تم نسخ الكود')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add('hidden'),2200)}
function goBack(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:'BUILDER_CLOSE'},'*')}else history.back()}

$('libFrame').addEventListener('load',()=>{try{const lib=$('libFrame').contentWindow.FOOD_LIBRARY;if(Array.isArray(lib)){FOOD_LIBRARY=lib;renderAll()}else toast('تعذر قراءة مكتبة الأغذية')}catch(e){toast('تعذر تحميل مكتبة الأغذية')}});
init();
</script>
