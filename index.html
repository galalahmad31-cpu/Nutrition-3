<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Nutrition - Dr. Ahmed Galal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استدعاء مكتبة Supabase بشكل صحيح -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app" class="app-container">
        <header class="main-header">
            <button id="homeBtn" class="home-icon"><i class="fas fa-house"></i></button>
            <div class="header-text">
                <h1>NICU Nutrition</h1>
                <p>Developed by Dr. Ahmed Galal</p>
                <small>Nutrition Support Pharmacist</small>
            </div>
        </header>

        <main id="viewContainer">
            <!-- Dashboard -->
            <section id="dashboardView" class="view">
                <div class="dashboard-grid">
                    <button id="navToAddPatient" class="dash-card blue">
                        <i class="fas fa-user-plus"></i>
                        <span>Add New Patient</span>
                        <small>تسجيل مريض جديد</small>
                    </button>
                    <button id="navToPatientList" class="dash-card purple">
                        <i class="fas fa-users"></i>
                        <span>View Patients</span>
                        <small>استعراض قائمة المرضى</small>
                    </button>
                </div>
            </section>

            <!-- Add Patient -->
            <section id="addPatientView" class="view hidden">
                <div class="form-container">
                    <div class="view-header">
                        <button class="back-to-dash back-btn"><i class="fas fa-arrow-right"></i> Cancel</button>
                        <h2>Register New Patient</h2>
                    </div>
                    <form id="patientForm" class="card shadow">
                        <div class="form-group">
                            <label>Patient Full Name</label>
                            <input type="text" id="p_name" required placeholder="Full Name">
                        </div>
                        <button type="submit" class="btn-primary">Register Patient</button>
                    </form>
                </div>
            </section>

            <!-- Patient List -->
            <section id="patientListView" class="view hidden">
                <div class="view-header">
                    <button class="back-to-dash back-btn"><i class="fas fa-arrow-right"></i> Back</button>
                    <h2>Patients Directory</h2>
                </div>
                <div id="patientsGrid" class="list-grid">
                    <p class="loading-text">Loading patients...</p>
                </div>
            </section>

            <!-- Patient Profile -->
            <section id="patientProfileView" class="view hidden">
                <div class="view-header">
                    <button id="backToList" class="back-btn"><i class="fas fa-arrow-right"></i> Back</button>
                    <button id="addVisitBtn" class="btn-success"><i class="fas fa-plus"></i> Add Visit</button>
                </div>
                <div id="patientInfoBanner" class="card shadow banner"></div>
                <h3 class="section-title">History & Visits</h3>
                <div id="visitsGrid" class="visits-grid"></div>
            </section>

            <!-- Visit Editor -->
            <section id="visitEditorView" class="view hidden">
                <div class="editor-toolbar shadow">
                    <div class="toolbar-info">
                        <button id="backToProfile" class="back-btn"><i class="fas fa-arrow-right"></i></button>
                        <div id="editorTitle">
                            <h4 id="currentPatientName">Patient Name</h4>
                            <span id="visitStatus">New Visit</span>
                        </div>
                    </div>
                    <button id="saveVisitBtn" class="btn-primary"><i class="fas fa-save"></i> Save Visit</button>
                </div>

                <div class="tabs-container">
                    <div class="tab-header">
                        <button class="tab-btn active" data-tab="en_sec">Enteral (EN)</button>
                        <button class="tab-btn" data-tab="pn_sec">Parenteral (PN)</button>
                    </div>
                    <div id="en_sec" class="tab-content active">
                        <div class="calc-section purple">
                            <h3><i class="fas fa-utensils"></i> Enteral Nutrition</h3>
                            <div class="grid-3">
                                <div class="form-group">
                                    <label>Weight (kg)</label>
                                    <input type="number" step="0.01" class="en-input" data-key="weight">
                                </div>
                                <div class="form-group">
                                    <label>Feeding Option</label>
                                    <select class="en-input" data-key="option">
                                        <option>Breast milk</option>
                                        <option>Term formula</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Freq (Hrs)</label>
                                    <input type="number" class="en-input" data-key="hours">
                                </div>
                            </div>
                            <div id="enResults" class="results-box"></div>
                        </div>
                    </div>
                    <div id="pn_sec" class="tab-content">
                        <div class="calc-section blue">
                            <h3><i class="fas fa-vial"></i> Parenteral Nutrition</h3>
                            <div class="grid-3">
                                <div class="form-group">
                                    <label>Weight (kg)</label>
                                    <input type="number" step="0.01" class="pn-input" data-key="weight">
                                </div>
                                <div class="form-group">
                                    <label>Fluid (ml/kg)</label>
                                    <input type="number" class="pn-input" data-key="fluidKg">
                                </div>
                            </div>
                            <div id="pnResults" class="results-box"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

```
