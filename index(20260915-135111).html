<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — تسجيل الدخول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:radial-gradient(circle at 90% 0%,rgba(23,143,132,.10),transparent 28%),radial-gradient(circle at 5% 95%,rgba(23,143,132,.07),transparent 25%),#f7fafb;display:flex;align-items:center;justify-content:center;color:#17252a}.card{width:min(430px,92%);background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.85);border-radius:24px;box-shadow:0 18px 45px rgba(15,71,67,.10);padding:30px}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:#178f84;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 10px 24px rgba(23,143,132,.20)}h1{text-align:center;margin:0;font-size:25px;font-weight:800}.sub{text-align:center;color:#64748b;margin:8px 0 25px}.tabs{display:flex;background:#eef7f6;padding:4px;border-radius:12px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:9px;cursor:pointer;font-weight:700;color:#64748b;font-family:inherit}.tabs button.active{background:#fff;color:#11786f;box-shadow:0 2px 8px #0000000f}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;outline:0;font-size:15px;font-family:inherit}.field input:focus{border-color:#178f84;box-shadow:0 0 0 3px rgba(23,143,132,.08)}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#178f84;color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}.btn:hover{background:#11786f}.btn:disabled{opacity:.6}.google-btn{width:100%;border:1px solid #d8dee8;border-radius:11px;padding:12px;background:#fff;color:#334155;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}.google-btn:hover{background:#f8fafc;border-color:#cbd5e1}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:11px;font-weight:700;margin:14px 0}.divider:before,.divider:after{content:"";height:1px;background:#e2e8f0;flex:1}.site-link{text-align:center;margin-top:18px;font-size:12px}.site-link a{color:#11786f;text-decoration:none;font-weight:700}.site-link a:hover{text-decoration:underline}.msg{display:none;margin-bottom:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.msg.error{background:#fef2f2;color:#b42318}.msg.success{background:#ecfdf3;color:#067647}
</style>
</head>
<body>
<div class="card">
<div class="logo"><i class="fa-solid fa-leaf"></i></div>
<h1>Diet Planner</h1>
<div class="sub">نظام إدارة الخطط الغذائية</div>
<div class="tabs">
<button type="button" data-auth-tab="loginForm" class="active">تسجيل الدخول</button>
<button type="button" data-auth-tab="registerForm">إنشاء حساب</button>
</div>
<div id="authMessage" class="msg"></div>
<form id="loginForm" class="auth-form" onsubmit="return false">
<div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div>
<div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
<button id="loginButton" type="button" class="btn">تسجيل الدخول</button>
<div class="divider"><span>أو</span></div>
<button id="googleLoginButton" type="button" class="google-btn">
<i class="fa-brands fa-google"></i>
<span>المتابعة باستخدام Google</span>
</button>
<div style="text-align:center;margin-top:12px;">
  <a href="privacy.html" style="color:#11786f;text-decoration:none;font-size:12px;font-weight:700;">Privacy Policy</a>
</div>
</form>
<form id="registerForm" class="auth-form" style="display:none" onsubmit="return false">
<div class="field"><label>الاسم</label><input id="registerName" type="text" autocomplete="name"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="registerEmail" type="email" autocomplete="email"></div>
<div class="field"><label>كلمة المرور</label><input id="registerPassword" type="password" autocomplete="new-password"></div>
<button id="registerButton" type="button" class="btn">إنشاء الحساب</button>
</form>
</div>
<script>
// =========================================================
// Diet Planner — Authentication + Access Control
// Single-file version: index.html
// =========================================================

const SUPABASE_URL = "https://zwxnmnfoknfbzvptnpmv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

function showAuthMessage(message, type = "error") {
  const box = document.getElementById("authMessage");
  if (!box) return;
  box.textContent = message;
  box.className = "msg " + type;
  box.style.display = "block";
}

function setBusy(button, busy, text) {
  if (!button) return;
  button.disabled = busy;
  button.textContent = busy ? "جاري التنفيذ..." : text;
}

function getToday() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

async function getUserRole(userId) {
  if (!userId) return null;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", userId)
    .maybeSingle();

  if (error) {
    console.error("Role check error:", error);
    return null;
  }

  return data?.role || "user";
}

async function hasActiveSubscription(userId) {
  if (!userId) return null;

  const { data, error } = await supabaseClient
    .from("subscriptions")
    .select("id,status,expiry_date")
    .eq("user_id", userId)
    .eq("status", "paid")
    .gte("expiry_date", getToday())
    .order("expiry_date", { ascending: false })
    .limit(1);

  if (error) {
    console.error("Subscription check error:", error);
    return null;
  }

  return Array.isArray(data) && data.length > 0;
}

let accessCheckPromise = null;

function checkUserAccess(session) {
  if (!session?.user) return Promise.resolve(false);
  if (accessCheckPromise) return accessCheckPromise;

  accessCheckPromise = (async () => {
    const userId = session.user.id;
    const role = await getUserRole(userId);

    // If the access data could not be read, stay on index.
    // Never send the user to the subscription page because of a database/RLS error.
    if (role === null) {
      showAuthMessage("تعذر التحقق من صلاحية الحساب حاليًا. حاول مرة أخرى.");
      return false;
    }

    // Admin: always allowed.
    if (role === "admin") {
      window.location.replace("app.html");
      return true;
    }

    // Regular user: active/paid subscription and valid expiry required.
    const active = await hasActiveSubscription(userId);

    if (active === null) {
      showAuthMessage("تعذر التحقق من حالة الاشتراك حاليًا. حاول مرة أخرى.");
      return false;
    }

    if (active) {
      window.location.replace("app.html");
      return true;
    }

    // Authenticated user with no active subscription.
    window.location.replace("subscription_plans_index.html");
    return false;
  })();

  return accessCheckPromise.finally(() => {
    accessCheckPromise = null;
  });
}

async function checkSession() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    console.error("Session check error:", error);
    return;
  }

  // No session = normal login page. Do not redirect anywhere.
  if (!data?.session) return;

  // Confirm that the session still represents a real authenticated user.
  // This prevents stale/invalid session state from causing redirect loops.
  const { data: userData, error: userError } = await supabaseClient.auth.getUser();

  if (userError || !userData?.user) {
    console.warn("No valid authenticated user found; staying on index.");
    return;
  }

  await checkUserAccess(data.session);
}

async function loginUser() {
  const email = document.getElementById("loginEmail")?.value.trim();
  const password = document.getElementById("loginPassword")?.value;
  const button = document.getElementById("loginButton");

  if (!email || !password) {
    showAuthMessage("من فضلك أدخل البريد الإلكتروني وكلمة المرور.");
    return;
  }

  setBusy(button, true, "تسجيل الدخول");

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  setBusy(button, false, "تسجيل الدخول");

  if (error) {
    showAuthMessage(
      error.message.includes("Invalid login credentials")
        ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
        : error.message
    );
    return;
  }

  await checkUserAccess(data?.session);
}

async function registerUser() {
  const name = document.getElementById("registerName")?.value.trim();
  const email = document.getElementById("registerEmail")?.value.trim();
  const password = document.getElementById("registerPassword")?.value;
  const button = document.getElementById("registerButton");

  if (!name || !email || !password) {
    showAuthMessage("من فضلك أكمل جميع البيانات.");
    return;
  }

  if (password.length < 6) {
    showAuthMessage("كلمة المرور يجب ألا تقل عن 6 أحرف.");
    return;
  }

  setBusy(button, true, "إنشاء الحساب");

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: name }
    }
  });

  setBusy(button, false, "إنشاء الحساب");

  if (error) {
    showAuthMessage(error.message);
    return;
  }

  if (data?.session) {
    await checkUserAccess(data.session);
    return;
  }

  showAuthMessage(
    "تم إنشاء الحساب بنجاح. إذا كان تأكيد البريد الإلكتروني مفعّلًا، افتح رسالة التأكيد ثم سجل الدخول. بعد ذلك سيتم توجيهك تلقائيًا حسب نوع حسابك واشتراكك.",
    "success"
  );
}

async function loginWithGoogle() {
  const button = document.getElementById("googleLoginButton");

  if (button) {
    button.disabled = true;
    button.innerHTML = '<i class="fa-brands fa-google"></i><span>جاري فتح Google...</span>';
  }

  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: "https://nutrition-3.vercel.app/index.html"
      }
    });

    if (error) throw error;
  } catch (error) {
    showAuthMessage(error?.message || "تعذر تسجيل الدخول باستخدام Google.");

    if (button) {
      button.disabled = false;
      button.innerHTML = '<i class="fa-brands fa-google"></i><span>المتابعة باستخدام Google</span>';
    }
  }
}

async function logoutUser() {
  await supabaseClient.auth.signOut();
  window.location.replace("index.html");
}

document.addEventListener("DOMContentLoaded", () => {
  // Check an already-existing session first.
  checkSession();

  document.getElementById("loginButton")?.addEventListener("click", loginUser);
  document.getElementById("registerButton")?.addEventListener("click", registerUser);
  document.getElementById("googleLoginButton")?.addEventListener("click", loginWithGoogle);

  document.querySelectorAll("[data-auth-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.authTab;

      document.querySelectorAll("[data-auth-tab]").forEach(b => {
        b.classList.toggle("active", b === btn);
      });

      document.querySelectorAll(".auth-form").forEach(form => {
        form.style.display = form.id === target ? "block" : "none";
      });

      const box = document.getElementById("authMessage");
      if (box) box.style.display = "none";
    });
  });
});
</script>
</body>
</html>
