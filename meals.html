<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الوجبات الثابتة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Arial,sans-serif;background:#f8fafc}</style>
</head>
<body class="p-4">
<div class="max-w-3xl mx-auto space-y-4">
  <div class="bg-white border rounded-2xl p-4">
    <h1 class="font-black text-slate-800">الوجبات الثابتة</h1>
    <p class="text-xs text-slate-500 mt-1">اكتب الوجبات يدويًا في مصفوفة FIXED_MEALS أسفل الصفحة.</p>
  </div>
  <div id="meals" class="grid gap-3"></div>
</div>

<script>
/*
==============================================================
طريقة إضافة وجبة ثابتة — فقط انسخ هذا الشكل:

{
  name: "فطار عالي البروتين",
  items: [
    { foodId: "food_0001", grams: 150 },
    { foodId: "food_0002", grams: 200 }
  ]
},

foodId يجب أن يكون id موجودًا في lib.html.
مثال عملي:
  { foodId: "food_0001", grams: 150 }

بعد الحفظ، افتح index.html واضغط "الوجبات الثابتة".
==============================================================
*/
const FIXED_MEALS = [
  {
    name: "مثال — احذفه أو عدله",
    items: [
      { foodId: "food_0001", grams: 150 },
      { foodId: "food_0002", grams: 200 }
    ]
  }
];

function sendMeal(meal){
  const target = window.opener || window.parent;
  if (!target || target.closed) {
    alert("افتح الوجبات من index.html ثم اضغط «إضافة للخطة».");
    return;
  }
  target.postMessage({type:"ADD_FIXED_MEAL",meal}, window.location.origin);
  window.close();
}

document.getElementById("meals").innerHTML = FIXED_MEALS.map((meal,i)=>`
  <div class="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between gap-3">
    <div>
      <h2 class="font-black text-slate-800">${escapeHtml(meal.name)}</h2>
      <p class="text-[11px] text-slate-400 mt-1">${meal.items.length} صنف</p>
    </div>
    <button onclick="sendMeal(FIXED_MEALS[${i}])"
      class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl">
      إضافة للخطة
    </button>
  </div>
`).join("");

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
