<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات الدايتات الثابتة</title>
</head>
<body>
<script>
/*
================================================================
الدايتات الثابتة — مصدر البيانات
================================================================
كل عنصر هنا = "يوم غذائي كامل"، وليس وجبة واحدة.

التركيب:
diet
 ├── name
 ├── description
 └── meals
      ├── فطار
      │    └── items
      ├── سناك
      │    └── items
      ├── غداء
      │    └── items
      └── عشاء
           └── items

foodId يجب أن يكون ID موجودًا في lib.html.
grams = الكمية بالجرام.

عند اختيار "تطبيق اليوم" من index.html:
سيتم إنشاء الفطار والغداء والعشاء والسناك داخل نفس اليوم
وبنفس ترتيبها وأصنافها وكمياتها.
================================================================
*/

const FIXED_MEALS = [
  {
    name: "مثال — دايت يوم كامل",
    description: "مثال توضيحي: احذفه واستبدله بالدايتات الخاصة بك.",
    meals: [
      {
        name: "الفطار",
        description: "وجبة الفطار",
        items: [
          { foodId: "food_0001", grams: 100 },
          { foodId: "food_0002", grams: 50 }
        ]
      },
      {
        name: "الغداء",
        description: "وجبة الغداء",
        items: [
          { foodId: "food_0010", grams: 150 }
        ]
      },
      {
        name: "العشاء",
        description: "وجبة العشاء",
        items: [
          { foodId: "food_0020", grams: 100 }
        ]
      }
    ]
  }

  // أضف دايتًا كاملًا آخر هنا:

  //       items: [
  //         { foodId: "food_0030", grams: 100 }
  //       ]
  //     }
  //   ]
  // }
];

try {
  window.parent.postMessage(
    { type: "FIXED_MEALS_DATA", meals: FIXED_MEALS },
    "*"
  );
} catch (e) {}
</script>
