<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الزيارة | Diet Planner | د. أحمد جلال</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:'Cairo',sans-serif;background:#f8fafc;color:#0f172a}
    .bg-brand-500{background-color:#178f84}
    .module-card{transition:.18s ease}
    .module-card:hover{transform:translateY(-2px)}
  </style>
</head>

<body class="min-h-screen">

<header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3 min-w-0">
      <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-leaf text-2xl"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-black text-lg leading-tight">Diet Planner</h1>
        <p class="text-xs font-bold text-emerald-400">د. أحمد جلال</p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <a href="app.html"
         class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
        لوحة التحكم
      </a>
      <button type="button" onclick="backToPatient()"
         class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
        ← ملف المريض
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

  <section id="loadingState" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 text-center text-sm text-slate-400">
    جاري تحميل بيانات الزيارة...
  </section>

  <section id="errorState" class="hidden bg-white border border-red-200 rounded-2xl shadow-sm p-8 text-center">
    <div class="text-3xl mb-3">⚠️</div>
    <p id="errorText" class="text-sm font-bold text-red-600"></p>
    <button type="button" onclick="backToPatient()"
      class="mt-4 bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold">
      العودة لملف المريض
    </button>
  </section>

  <div id="visitContent" class="hidden">

    <!-- VISIT HEADER -->
    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

        <div class="flex items-center gap-3 min-w-0">
          <div class="w-14 h-14 shrink-0 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl">
            📋
          </div>

          <div class="min-w-0">
            <h2 id="patientName" class="font-black text-slate-800 text-xl">—</h2>
            <p class="text-xs text-slate-400 mt-1">
              زيارة رقم <span id="visitNumber" class="font-extrabold text-slate-600">—</span>
              <span class="mx-1">•</span>
              <span id="visitDate">—</span>
            </p>
          </div>
        </div>

        <button type="button" onclick="backToPatient()"
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold px-4 py-2.5 rounded-xl">
          العودة لملف المريض
        </button>
      </div>
    </section>

    <!-- VISIT MODULES -->
    <section class="mt-6">
      <div class="mb-4">
        <h3 class="font-black text-slate-800 text-lg">محتوى الزيارة</h3>
        <p class="text-xs text-slate-400 mt-1">اختر الأداة التي تريد استخدامها داخل هذه الزيارة.</p>
      </div>

      <div class="grid grid-cols-2 gap-2 sm:gap-4 items-stretch">

        <div>
          <button id="calculatorCard" type="button" onclick="toggleModule('calculator')"
             class="module-card w-full text-right block bg-white border border-slate-200 rounded-2xl p-3 sm:p-5 shadow-sm hover:border-sky-300 hover:shadow-md">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 shrink-0 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">🧮</div>
              <div class="min-w-0">
                <h4 class="font-black text-slate-800">حاسبة السعرات والماكروز</h4>
                <p class="text-[11px] text-slate-400 mt-1">حساب الاحتياجات الغذائية وأهداف الماكروز للزيارة.</p>
              </div>
            </div>
          </button>

          <div id="calculatorContent" class="hidden mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <iframe id="calculatorFrame" class="w-full border-0" style="height:900px;" loading="lazy"></iframe>
          </div>
        </div>

        <div>
          <button id="dietPlanCard" type="button" onclick="toggleModule('dietPlan')"
             class="module-card w-full text-right block bg-white border border-slate-200 rounded-2xl p-3 sm:p-5 shadow-sm hover:border-emerald-300 hover:shadow-md">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 shrink-0 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">🍽️</div>
              <div class="min-w-0">
                <h4 class="font-black text-slate-800">الخطة الغذائية</h4>
                <p class="text-[11px] text-slate-400 mt-1">إنشاء ومتابعة الخطة الغذائية الخاصة بهذه الزيارة.</p>
              </div>
            </div>
          </button>

          <div id="dietPlanContent" class="hidden mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <iframe id="dietPlanFrame" class="w-full border-0" style="height:900px;" loading="lazy"></iframe>
          </div>
        </div>

      </div>
    </section>

  </div>
</main>

<script>
  const SUPABASE_URL = "https://zwxnmnfoknfbzvptnpmv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const visitId = new URLSearchParams(window.location.search).get('id');

  let visit = null;

  function showError(message) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('visitContent').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorText').textContent = message;
  }

  async function getCurrentUser() {
    const { data, error } = await db.auth.getUser();
    if (error) return null;
    return data?.user || null;
  }

  function formatVisitDate(date) {
    if (!date) return 'بدون تاريخ';
    const d = new Date(date + 'T00:00:00');
    return new Intl.DateTimeFormat('ar-EG', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }).format(d);
  }

  async function loadVisit() {
    if (!visitId) {
      showError('لم يتم تحديد الزيارة.');
      return;
    }

    const user = await getCurrentUser();

    if (!user) {
      showError('يجب تسجيل الدخول أولاً.');
      return;
    }

    const { data, error } = await db
      .from('patient_visits')
      .select(`
        id,
        patient_id,
        visit_number,
        visit_date,
        patients (
          id,
          name
        )
      `)
      .eq('id', visitId)
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) {
      console.error(error);
      showError('تعذر تحميل بيانات الزيارة.');
      return;
    }

    if (!data) {
      showError('الزيارة غير موجودة أو لا تملك صلاحية الوصول إليها.');
      return;
    }

    visit = data;

    document.getElementById('patientName').textContent =
      data.patients?.name || 'بدون اسم';

    document.getElementById('visitNumber').textContent =
      data.visit_number ?? '—';

    document.getElementById('visitDate').textContent =
      formatVisitDate(data.visit_date);

    document.getElementById('calculatorFrame').src =
      'nutrition-calculator.html?visit_id=' + encodeURIComponent(data.id);

    document.getElementById('dietPlanFrame').src =
      'diet-plan.html?visit_id=' + encodeURIComponent(data.id);

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('visitContent').classList.remove('hidden');
  }

  function toggleModule(module) {
    const content = document.getElementById(
      module === 'calculator' ? 'calculatorContent' : 'dietPlanContent'
    );

    const otherContent = document.getElementById(
      module === 'calculator' ? 'dietPlanContent' : 'calculatorContent'
    );

    const isOpen = !content.classList.contains('hidden');

    // Keep only one module open at a time for easier navigation.
    otherContent.classList.add('hidden');

    if (isOpen) {
      content.classList.add('hidden');
      return;
    }

    content.classList.remove('hidden');
    content.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function backToPatient() {
    if (visit?.patient_id) {
      window.location.href =
        'patient-profile.html?id=' + encodeURIComponent(visit.patient_id);
      return;
    }

    window.history.back();
  }

  document.addEventListener('DOMContentLoaded', loadVisit);
</script>

</body>
</html>
