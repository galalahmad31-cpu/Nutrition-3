<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عن التطبيق | Diet Planner</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef7f6',
              100: '#d9efec',
              500: '#178f84',
              600: '#11786f',
              700: '#0d625b',
              800: '#0b504b'
            }
          }
        }
      }
    }
  </script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Cairo,sans-serif;
      background:
        radial-gradient(circle at 90% 0%,rgba(23,143,132,.10),transparent 28%),
        radial-gradient(circle at 5% 95%,rgba(23,143,132,.07),transparent 25%),
        #f7fafb;
      color:#17252a;
    }
    .glass{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(226,232,240,.9);
      box-shadow:0 10px 35px rgba(15,71,67,.06);
    }
    .editor{
      min-height:120px;
      outline:none;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      line-height:2;
    }
    .editor:empty:before{
      content:attr(data-placeholder);
      color:#94a3b8;
      pointer-events:none;
    }
    .toolbar button{
      width:34px;height:34px;
      display:inline-flex;align-items:center;justify-content:center;
      border:1px solid #e2e8f0;
      border-radius:9px;
      background:#fff;color:#475569;
      transition:.15s;
    }
    .toolbar button:hover{
      background:#eef7f6;
      color:#11786f;
      border-color:#cfe8e5;
    }
    .content-display{
      line-height:2;
      overflow-wrap:anywhere;
    }
    .content-display p{margin:.45rem 0}
    .content-display ul{list-style:disc;padding-right:1.4rem;margin:.5rem 0}
    .content-display ol{list-style:decimal;padding-right:1.4rem;margin:.5rem 0}
    .section-card{animation:fadeIn .18s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .loading{
      position:fixed;inset:0;z-index:100;
      display:flex;align-items:center;justify-content:center;
      background:#f7fafb;
      transition:opacity .18s ease, visibility .18s ease;
    }
    .loading.is-hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .spinner{
      width:34px;height:34px;border:3px solid #d9efec;
      border-top-color:#178f84;border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>

<body class="min-h-screen">
  <div id="loadingScreen" class="loading">
    <div class="flex flex-col items-center gap-3">
      <div class="spinner"></div>
      <div class="text-sm font-semibold text-slate-500">جاري تحميل الصفحة...</div>
    </div>
  </div>

  <main class="min-h-screen px-4 py-6 sm:px-6">
    <div class="mx-auto max-w-4xl">

      <header class="glass rounded-3xl p-5 sm:p-7 mb-5">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4 min-w-0">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/20">
              <i class="fa-solid fa-leaf text-2xl"></i>
            </div>
            <div class="min-w-0">
              <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800">Diet Planner</h1>
              <p class="mt-1 text-xs font-semibold text-slate-400">عن التطبيق</p>
            </div>
          </div>

          <a href="app.html"
             class="shrink-0 rounded-xl bg-slate-800 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-slate-700 transition">
            الرئيسية
          </a>
        </div>
      </header>

      <section class="glass rounded-3xl p-5 sm:p-7">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h2 class="text-2xl font-black text-slate-800">عن التطبيق</h2>
            <p class="mt-2 text-sm leading-7 text-slate-500">
              محتوى تعريفي عن Diet Planner ومزاياه وطريقة استخدامه.
            </p>
          </div>

          <button id="addSectionBtn" type="button"
                  class="hidden shrink-0 inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-extrabold text-white shadow-sm hover:bg-brand-700 transition">
            <i class="fa-solid fa-plus"></i>
            إضافة مربع
          </button>
        </div>

        <div id="sectionsContainer" class="mt-6 space-y-4"></div>

        <div id="emptyState" class="hidden rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-8 text-center">
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-slate-400 shadow-sm">
            <i class="fa-regular fa-file-lines text-lg"></i>
          </div>
          <p class="mt-3 text-sm font-bold text-slate-600">لا يوجد محتوى بعد</p>
          <p id="emptyHint" class="mt-1 text-xs text-slate-400">سيظهر المحتوى هنا عند إضافته.</p>
        </div>
      </section>

      <footer class="py-6 text-center">
        <a href="app.html" class="text-xs font-bold text-brand-600 hover:text-brand-700">Diet Planner</a>
      </footer>
    </div>
  </main>

  <!-- Delete confirmation -->
  <div id="deleteModal" class="hidden fixed inset-0 z-[200] items-center justify-center bg-slate-900/45 px-4">
    <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-red-50 text-red-600">
        <i class="fa-solid fa-trash"></i>
      </div>
      <h3 class="mt-4 text-center text-lg font-black text-slate-800">تأكيد الحذف</h3>
      <p class="mt-2 text-center text-sm leading-7 text-slate-500">هل أنت متأكد من حذف هذا المربع؟ لا يمكن التراجع عن هذا الإجراء.</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button id="cancelDeleteBtn" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-extrabold text-slate-600 hover:bg-slate-50">إلغاء</button>
        <button id="confirmDeleteBtn" type="button" class="rounded-xl bg-red-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-red-700">حذف</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zwxnmnfoknfbzvptnpmv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const state = {
      isAdmin: false,
      sections: [],
      deletingId: null
    };

    const $ = (id) => document.getElementById(id);

    function showLoading(show) {
      const screen = $("loadingScreen");
      if (!screen) return;
      screen.classList.toggle("is-hidden", !show);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function closeDeleteModal() {
      state.deletingId = null;
      $("deleteModal")?.classList.add("hidden");
      $("deleteModal")?.classList.remove("flex");
    }

    function openDeleteModal(id) {
      state.deletingId = id;
      $("deleteModal")?.classList.remove("hidden");
      $("deleteModal")?.classList.add("flex");
    }

    function renderToolbar(sectionId) {
      return `
        <div class="toolbar flex flex-wrap items-center gap-1.5 border-b border-slate-100 pb-3 mb-3">
          <button type="button" data-cmd="bold" data-id="${sectionId}" title="عريض"><i class="fa-solid fa-bold"></i></button>
          <button type="button" data-cmd="italic" data-id="${sectionId}" title="مائل"><i class="fa-solid fa-italic"></i></button>
          <button type="button" data-cmd="underline" data-id="${sectionId}" title="تحته خط"><i class="fa-solid fa-underline"></i></button>
          <button type="button" data-cmd="insertUnorderedList" data-id="${sectionId}" title="قائمة"><i class="fa-solid fa-list-ul"></i></button>
          <button type="button" data-cmd="insertOrderedList" data-id="${sectionId}" title="قائمة مرقمة"><i class="fa-solid fa-list-ol"></i></button>
          <button type="button" data-cmd="justifyRight" data-id="${sectionId}" title="محاذاة يمين"><i class="fa-solid fa-align-right"></i></button>
          <button type="button" data-cmd="justifyCenter" data-id="${sectionId}" title="توسيط"><i class="fa-solid fa-align-center"></i></button>
          <button type="button" data-cmd="justifyLeft" data-id="${sectionId}" title="محاذاة يسار"><i class="fa-solid fa-align-left"></i></button>
          <button type="button" data-cmd="removeFormat" data-id="${sectionId}" title="إزالة التنسيق"><i class="fa-solid fa-eraser"></i></button>
        </div>`;
    }

    function sectionEditorHtml(section) {
      return `
        <div class="section-editor">
          ${renderToolbar(section.id)}
          <input data-field="title" data-id="${section.id}"
                 value="${escapeHtml(section.title || "")}"
                 placeholder="عنوان المربع"
                 class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-extrabold text-slate-800 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
          <div id="editor-${section.id}" contenteditable="true"
               data-id="${section.id}" data-placeholder="اكتب محتوى المربع هنا..."
               class="editor mt-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-100">${section.content || ""}</div>
          <div class="mt-4 flex flex-wrap items-center justify-end gap-2">
            <button type="button" data-action="save" data-id="${section.id}"
                    class="rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-brand-700">
              <i class="fa-solid fa-check ml-1"></i>حفظ
            </button>
            <button type="button" data-action="cancel" data-id="${section.id}"
                    class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-extrabold text-slate-600 hover:bg-slate-50">
              إلغاء
            </button>
          </div>
        </div>`;
    }

    function sectionViewHtml(section) {
      return `
        <article class="section-card glass rounded-3xl p-5 sm:p-6" data-section-id="${section.id}">
          ${section.title ? `<h3 class="text-lg font-black text-slate-800">${escapeHtml(section.title)}</h3>` : ""}
          <div class="content-display mt-${section.title ? "3" : "0"} text-sm text-slate-600">${section.content || ""}</div>
          ${state.isAdmin ? `
            <div class="mt-5 flex justify-end gap-2 border-t border-slate-100 pt-4">
              <button type="button" data-action="edit" data-id="${section.id}"
                      class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-extrabold text-slate-600 hover:bg-slate-50">
                <i class="fa-solid fa-pen ml-1"></i>تعديل
              </button>
              <button type="button" data-action="delete" data-id="${section.id}"
                      class="rounded-xl bg-red-50 px-4 py-2.5 text-xs font-extrabold text-red-600 hover:bg-red-100">
                <i class="fa-solid fa-trash ml-1"></i>حذف
              </button>
            </div>` : ""}
        </article>`;
    }

    function render() {
      const container = $("sectionsContainer");
      const empty = $("emptyState");
      if (!container) return;

      container.innerHTML = "";

      if (!state.sections.length) {
        empty?.classList.remove("hidden");
        if ($("emptyHint")) {
          $("emptyHint").textContent = state.isAdmin
            ? "استخدم «إضافة مربع» لبدء كتابة محتوى الصفحة."
            : "سيظهر المحتوى هنا عند إضافته.";
        }
        return;
      }

      empty?.classList.add("hidden");
      state.sections.forEach(section => {
        const wrapper = document.createElement("div");
        wrapper.innerHTML = section._editing
          ? `<article class="section-card glass rounded-3xl p-5 sm:p-6" data-section-id="${section.id}">${sectionEditorHtml(section)}</article>`
          : sectionViewHtml(section);
        container.appendChild(wrapper.firstElementChild);
      });
    }

    async function loadRole() {
      const { data: { user }, error: userError } = await supabase.auth.getUser();
      if (userError || !user) {
        window.location.replace("index.html");
        return null;
      }

      let isAdmin = false;

      // Use the existing server-side admin helper first.
      const { data: adminResult, error: adminError } = await supabase.rpc("is_admin");
      if (!adminError) {
        isAdmin = adminResult === true;
      } else {
        // Fallback to the profile role if the RPC is unavailable.
        const { data: profile, error: profileError } = await supabase
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .maybeSingle();

        if (profileError) throw profileError;
        isAdmin = profile?.role === "admin";
      }

      state.isAdmin = isAdmin;
      $("addSectionBtn")?.classList.toggle("hidden", !state.isAdmin);
      return user;
    }

    async function loadSections() {
      const { data, error } = await supabase
        .from("about_sections")
        .select("id,title,content,display_order,created_at,updated_at")
        .order("display_order", { ascending: true })
        .order("created_at", { ascending: true });

      if (error) throw error;
      state.sections = data || [];
      render();
    }

    function newSection() {
      if (!state.isAdmin) return;
      const section = {
        id: crypto.randomUUID(),
        title: "",
        content: "",
        display_order: state.sections.length
          ? Math.max(...state.sections.map(x => Number(x.display_order) || 0)) + 1
          : 0,
        _new: true,
        _editing: true
      };
      state.sections.push(section);
      render();
      setTimeout(() => {
        document.querySelector(`[data-field="title"][data-id="${section.id}"]`)?.focus();
      }, 0);
    }

    function editSection(id) {
      if (!state.isAdmin) return;
      const section = state.sections.find(x => x.id === id);
      if (!section) return;
      section._editing = true;
      render();
      setTimeout(() => {
        document.getElementById(`editor-${id}`)?.focus();
      }, 0);
    }

    function cancelEdit(id) {
      const index = state.sections.findIndex(x => x.id === id);
      if (index < 0) return;
      const section = state.sections[index];

      if (section._new) {
        state.sections.splice(index, 1);
      } else {
        delete section._editing;
      }
      render();
    }

    async function saveSection(id) {
      if (!state.isAdmin) return;

      const section = state.sections.find(x => x.id === id);
      if (!section) return;

      const titleInput = document.querySelector(`[data-field="title"][data-id="${id}"]`);
      const editor = document.getElementById(`editor-${id}`);
      const title = titleInput?.value.trim() || "";
      const content = editor?.innerHTML.trim() || "";

      if (!content || content === "<br>") {
        alert("اكتب محتوى المربع أولاً.");
        editor?.focus();
        return;
      }

      const payload = {
        title,
        content,
        display_order: Number(section.display_order) || 0
      };

      const button = document.querySelector(`[data-action="save"][data-id="${id}"]`);
      if (button) {
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-1"></i>جاري الحفظ...';
      }

      const { data, error } = section._new
        ? await supabase.from("about_sections").insert(payload).select().single()
        : await supabase.from("about_sections").update(payload).eq("id", id).select().single();

      if (error) {
        if (button) {
          button.disabled = false;
          button.innerHTML = '<i class="fa-solid fa-check ml-1"></i>حفظ';
        }
        alert("تعذر حفظ المحتوى: " + error.message);
        return;
      }

      const index = state.sections.findIndex(x => x.id === id);
      state.sections[index] = { ...data, _editing: false };
      render();
    }

    async function deleteSection(id) {
      if (!state.isAdmin) return;
      openDeleteModal(id);
    }

    async function confirmDelete() {
      const id = state.deletingId;
      if (!id || !state.isAdmin) return;

      const button = $("confirmDeleteBtn");
      if (button) {
        button.disabled = true;
        button.textContent = "جاري الحذف...";
      }

      const { error } = await supabase
        .from("about_sections")
        .delete()
        .eq("id", id);

      if (error) {
        if (button) {
          button.disabled = false;
          button.textContent = "حذف";
        }
        alert("تعذر حذف المحتوى: " + error.message);
        return;
      }

      state.sections = state.sections.filter(x => x.id !== id);
      if (button) {
        button.disabled = false;
        button.textContent = "حذف";
      }
      closeDeleteModal();
      render();
    }

    function runCommand(command, id) {
      const editor = document.getElementById(`editor-${id}`);
      if (!editor) return;
      editor.focus();
      document.execCommand(command, false, null);
      autoGrow(editor);
    }

    function autoGrow(editor) {
      if (!editor) return;
      editor.style.height = "auto";
      editor.style.height = Math.max(120, editor.scrollHeight) + "px";
    }

    $("addSectionBtn")?.addEventListener("click", newSection);
    $("cancelDeleteBtn")?.addEventListener("click", closeDeleteModal);
    $("confirmDeleteBtn")?.addEventListener("click", confirmDelete);
    $("deleteModal")?.addEventListener("click", (event) => {
      if (event.target === $("deleteModal")) closeDeleteModal();
    });

    $("sectionsContainer")?.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const command = button.dataset.cmd;

      if (command) return runCommand(command, id);
      if (action === "save") return saveSection(id);
      if (action === "cancel") return cancelEdit(id);
      if (action === "edit") return editSection(id);
      if (action === "delete") return deleteSection(id);
    });

    $("sectionsContainer")?.addEventListener("input", (event) => {
      if (event.target.matches(".editor")) autoGrow(event.target);
    });

    $("sectionsContainer")?.addEventListener("keyup", (event) => {
      if (event.target.matches(".editor")) autoGrow(event.target);
    });

    $("sectionsContainer")?.addEventListener("paste", (event) => {
      const editor = event.target.closest(".editor");
      if (editor) setTimeout(() => autoGrow(editor), 0);
    });

    (async function start() {
      // Keep the page visible even if authentication/database initialization fails.
      const failSafe = setTimeout(() => showLoading(false), 6000);
      try {
        await loadRole();
        await loadSections();
      } catch (error) {
        console.error("About page initialization failed:", error);
        $("sectionsContainer").innerHTML = `
          <div class="rounded-2xl border border-red-100 bg-red-50 p-4 text-sm text-red-700">
            تعذر تحميل محتوى الصفحة. حاول تحديث الصفحة مرة أخرى.
          </div>`;
      } finally {
        clearTimeout(failSafe);
        showLoading(false);
      }
    })();
  </script>
</body>
</html>
