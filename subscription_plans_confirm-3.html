<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطط الاشتراك - Diet Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',sans-serif;background:#f6f8f9;color:#173c39}
.header{background:#fff;border-bottom:1px solid #e5eceb;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:#178f84;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px}
.brand-title{font-size:18px;font-weight:800}.brand-sub{font-size:11px;color:#78908d}.header-actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:700;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px)}
.btn-outline{background:#fff;color:#11786f;border:1px solid #cfe1df}.btn-primary{background:#11786f;color:#fff}.btn-danger{background:#fff0f0;color:#b42318}
.container{max-width:1100px;margin:0 auto;padding:32px 18px 50px}.page-title{text-align:center;margin-bottom:28px}.page-title h1{margin:0 0 6px;font-size:28px;font-weight:800}.page-title p{margin:0;color:#718683;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.empty{background:#fff;border:1px dashed #cbdad8;border-radius:18px;padding:45px 20px;text-align:center;color:#758a87;grid-column:1/-1}
.card{background:#fff;border:1px solid #e1e9e8;border-radius:20px;padding:24px;box-shadow:0 8px 25px rgba(20,60,56,.05);display:flex;flex-direction:column;min-height:310px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:20px;font-weight:800}.badge{background:#e8f6f4;color:#11786f;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700}
.price{margin:20px 0 4px;color:#11786f;font-size:30px;font-weight:800}.duration{color:#738783;font-size:13px}.method{margin-top:18px;padding:12px;background:#f6faf9;border-radius:12px;font-size:13px}.method strong{display:block;margin-bottom:4px}
.description{color:#687d79;font-size:13px;line-height:1.8;margin:14px 0}.card-actions{margin-top:auto;display:flex;gap:8px}.card-actions .btn{flex:1}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(14,40,37,.48);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal h2{margin:0 0 20px;font-size:20px}
.form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.form-group input,.form-group textarea{width:100%;border:1px solid #d6e2e0;border-radius:10px;padding:11px 12px;font-family:inherit;outline:none}.form-group input:focus,.form-group textarea:focus{border-color:#178f84}.form-group textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions .btn{flex:1}.loading{text-align:center;color:#70837f;padding:50px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#173c39;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.header{padding:12px 14px}.brand-sub{display:none}.container{padding:25px 13px 40px}.page-title h1{font-size:24px}}

.confirm-backdrop{display:none;position:fixed;inset:0;background:rgba(14,40,37,.52);z-index:1100;align-items:center;justify-content:center;padding:18px}.confirm-modal{width:100%;max-width:390px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.22);text-align:center;direction:rtl}.confirm-icon{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:#fff0f0;color:#b42318;display:flex;align-items:center;justify-content:center;font-size:22px}.confirm-modal h3{margin:0 0 8px;color:#173c39;font-size:18px;font-weight:800}.confirm-message{color:#6d817d;font-size:13px;line-height:1.9;margin:0 0 18px}.confirm-actions{display:flex;gap:9px}.confirm-actions .btn{flex:1}.btn-confirm-danger{background:#c62828;color:#fff;border:1px solid #c62828}.btn-confirm-danger:hover{background:#b71c1c}
</style>
</head>
<body>
<header class="header">
<div class="brand"><div class="logo"><i class="fa-solid fa-leaf"></i></div><div><div class="brand-title">Diet Planner</div><div class="brand-sub">Developed by Dr. Ahmed Galal</div></div></div>
<div class="header-actions">
<button id="dashboardBtn" class="btn btn-outline" onclick="goDashboard()"><i class="fa-solid fa-gauge-high"></i> لوحة التحكم</button>
<button id="profileBtn" class="btn btn-outline" onclick="goProfile()"><i class="fa-solid fa-user"></i> الملف الشخصي</button>
</div>
</header>
<main class="container">
<div class="page-title"><h1>خطط الاشتراك</h1><p>اختر الخطة المناسبة لك واستمتع بمزايا Diet Planner</p></div>
<div id="plans" class="plans"><div class="loading">جاري تحميل الخطط...</div></div>
</main>

<div id="subscribeModal" class="modal-backdrop">
<div class="modal">
<h2>الاشتراك في الخطة</h2>

<div id="selectedPlanInfo" style="background:#f6faf9;border-radius:12px;padding:13px;margin-bottom:16px;font-size:13px;line-height:1.9"></div>

<div class="form-group">
<label>صورة التحويل</label>
<input id="paymentProof" type="file" accept="image/jpeg,image/png,image/webp">
<div style="font-size:11px;color:#7b8d89;margin-top:6px">يفضل أن تكون الصورة واضحة. الحد الأقصى 5 ميجابايت.</div>
</div>

<div class="form-group">
<label>ملاحظات (اختياري)</label>
<textarea id="paymentNote" placeholder="أي ملاحظات خاصة بالتحويل"></textarea>
</div>

<div id="pendingActions" style="display:none;margin-top:10px;gap:8px;flex-wrap:wrap">
<button id="replaceProofBtn" class="btn btn-outline" onclick="replacePendingProof()"><i class="fa-solid fa-image"></i> تعديل إثبات الدفع</button>
<button id="cancelSubscriptionBtn" class="btn btn-danger" onclick="cancelPendingSubscription()"><i class="fa-solid fa-ban"></i> إلغاء الطلب</button>
</div>

<div class="modal-actions">
<button class="btn btn-outline" onclick="closeSubscribeModal()">إغلاق</button>
<button id="submitSubscriptionBtn" class="btn btn-primary" onclick="submitSubscription()">إرسال طلب الاشتراك</button>
</div>
</div>
</div>

<div id="toast" class="toast"></div>
<div id="confirmOverlay" class="confirm-backdrop"><div class="confirm-modal" role="dialog" aria-modal="true"><div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><h3 id="confirmTitle">تأكيد العملية</h3><p id="confirmMessage" class="confirm-message"></p><div class="confirm-actions"><button class="btn btn-outline" onclick="resolveConfirm(false)">إلغاء</button><button class="btn btn-confirm-danger" onclick="resolveConfirm(true)">تأكيد</button></div></div></div>


<script>
const SUPABASE_URL="https://zwxnmnfoknfbzvptnpmv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,selectedPlanId=null;
let currentSubscription=null;
const state={plans:[],subscriptions:[]};


let confirmResolver=null;function showConfirmPopup(message,title='تأكيد العملية'){return new Promise(resolve=>{confirmResolver=resolve;document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMessage').innerHTML=message;document.getElementById('confirmOverlay').style.display='flex';});}function resolveConfirm(value){document.getElementById('confirmOverlay').style.display='none';if(confirmResolver){const r=confirmResolver;confirmResolver=null;r(value);}}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function goDashboard(){location.href='app.html'}
function goProfile(){location.href='profile.html'}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

async function checkUser(){
  const {data:{user},error}=await sb.auth.getUser();
  if(error)console.error(error);
  currentUser=user||null;
  return true;
}

async function loadPlans(){
  const c=document.getElementById('plans');
  const {data,error}=await sb.from('subscription_plans').select('*').eq('is_active',true).order('price',{ascending:true});
  if(error){
    console.error('subscription_plans load error:',error);
    c.innerHTML='<div class="empty"><i class="fa-solid fa-circle-exclamation"></i><div style="margin-top:8px">تعذر تحميل خطط الاشتراك</div></div>';
    return;
  }

  state.plans=data||[];
  state.subscriptions=[];

  if(currentUser){
    const {data:subs,error:subsError}=await sb
      .from('subscriptions')
      .select('id,user_id,start_date,expiry_date,status,notes,created_at,updated_at,full_name,plan_id,payment_proof_path')
      .eq('user_id',currentUser.id)
      .order('created_at',{ascending:false});

    if(subsError){
      console.error('subscriptions load error:',subsError);
    }else{
      state.subscriptions=subs||[];
    }
  }

  const activeSubscription=getActiveSubscription();
  const pendingSubscription=getPendingSubscription();

  if(!state.plans.length){
    c.innerHTML='<div class="empty">لا توجد خطط اشتراك متاحة حاليًا.</div>';
    return;
  }

  c.innerHTML=state.plans.map(p=>{
    const isActive=activeSubscription && activeSubscription.plan_id===p.id;
    const hasPending=pendingSubscription && pendingSubscription.plan_id===p.id;

    let action='';
    const trialUsed=p.is_free_trial===true && hasUsedFreeTrial();
    if(isActive){
      action=`<button class="btn btn-outline" disabled style="cursor:default;opacity:.9"><i class="fa-solid fa-circle-check"></i> الخطة مفعّلة</button>`;
    }else if(hasPending){
      action=`<button class="btn btn-outline" onclick="openPendingSubscription('${pendingSubscription.id}')"><i class="fa-solid fa-clock"></i> الطلب قيد المراجعة</button>`;
    }else if(trialUsed){
      action=`<button class="btn btn-outline" disabled style="cursor:default;opacity:.75"><i class="fa-solid fa-circle-check"></i> تم استخدام التجربة</button>`;
    }else{
      action=`<button class="btn btn-primary" onclick="subscribeToPlan('${p.id}')">${p.is_free_trial?'ابدأ التجربة':'اشتراك'}</button>`;
    }

    return `
    <div class="card">
      <div class="card-top"><h3>${escapeHtml(p.name)}</h3><span class="badge">اشتراك</span></div>
      <div class="price">${Number(p.price).toLocaleString('ar-EG')} <span style="font-size:13px;font-weight:700">جنيه</span></div>
      <div class="duration"><i class="fa-regular fa-calendar"></i> ${Number(p.duration_days)} يوم</div>
      <div class="method"><strong>طريقة التحويل</strong>${escapeHtml(p.payment_method)}</div>
      ${p.description?`<div class="description">${escapeHtml(p.description)}</div>`:''}
      <div class="card-actions">
       ${action}
      </div>
    </div>`;
  }).join('');
}

function getActiveSubscription(){
  if(!currentUser)return null;
  const today=new Date().toISOString().slice(0,10);
  return state.subscriptions.find(s=>
    s.status==='paid' &&
    s.start_date &&
    s.expiry_date &&
    s.start_date<=today &&
    s.expiry_date>=today
  )||null;
}

function getPendingSubscription(){
  if(!currentUser)return null;
  return state.subscriptions.find(s=>s.status==='pending')||null;
}

function hasUsedFreeTrial(){
  return state.subscriptions.some(s=>{
    const plan=state.plans.find(p=>p.id===s.plan_id);
    return plan?.is_free_trial===true;
  });
}

function setTrialModalMode(isTrial){
  const proofGroup=document.getElementById('paymentProof')?.closest('.form-group');
  const noteGroup=document.getElementById('paymentNote')?.closest('.form-group');
  if(proofGroup)proofGroup.style.display=isTrial?'none':'';
  if(noteGroup)noteGroup.style.display=isTrial?'none':'';
  const button=document.getElementById('submitSubscriptionBtn');
  if(button)button.textContent=isTrial?'بدء التجربة المجانية':'إرسال طلب الاشتراك';
}

function openPendingSubscription(subscriptionId){
  const subscription=state.subscriptions.find(s=>s.id===subscriptionId);
  if(!subscription)return;

  const plan=state.plans.find(p=>p.id===subscription.plan_id);
  currentSubscription=subscription;
  selectedPlanId=subscription.plan_id;

  document.getElementById('selectedPlanInfo').innerHTML=`
    <strong>${escapeHtml(plan?.name||'الخطة')}</strong><br>
    الحالة: <strong>قيد المراجعة</strong><br>
    ${plan?`المدة: ${Number(plan.duration_days)} يوم<br>السعر: ${Number(plan.price).toLocaleString('ar-EG')} جنيه<br>`:''}
    ${subscription.notes?`الملاحظات: ${escapeHtml(subscription.notes)}`:''}
  `;

  document.getElementById('paymentProof').value='';
  document.getElementById('paymentNote').value=subscription.notes||'';
  document.getElementById('submitSubscriptionBtn').style.display='none';
  document.getElementById('pendingActions').style.display='flex';
  document.getElementById('subscribeModal').style.display='flex';
}

function resetSubscriptionModal(){
  document.getElementById('submitSubscriptionBtn').style.display='inline-block';
  document.getElementById('pendingActions').style.display='none';
  document.getElementById('paymentProof').value='';
  document.getElementById('paymentNote').value='';
  setTrialModalMode(false);
}

function closeSubscribeModal(){
  document.getElementById('subscribeModal').style.display='none';
  selectedPlanId=null;
  currentSubscription=null;
  resetSubscriptionModal();
}
async function subscribeToPlan(id){
    resetSubscriptionModal();
    if(!currentUser){
        showToast('من فضلك سجل الدخول أولًا لإرسال الطلب');
        return;
    }

    const plan = state.plans.find(x => x.id === id);
    if(!plan) return;

    if(plan.is_free_trial && hasUsedFreeTrial()){
        showToast('لقد تم استخدام التجربة المجانية لهذا الحساب من قبل');
        return;
    }

    selectedPlanId = id;
    const isTrial=plan.is_free_trial===true;

    document.getElementById('selectedPlanInfo').innerHTML = `
        <strong>${escapeHtml(plan.name)}</strong><br>
        المدة: ${Number(plan.duration_days)} يوم<br>
        السعر: ${Number(plan.price).toLocaleString('ar-EG')} جنيه
        <br>طريقة التحويل: ${escapeHtml(plan.payment_method)}
    `;

    document.getElementById('paymentProof').value = '';
    document.getElementById('paymentNote').value = '';
    document.getElementById('submitSubscriptionBtn').disabled = false;
    setTrialModalMode(isTrial);
    document.getElementById('subscribeModal').style.display = 'flex';
}


async function submitSubscription(){
    if(!currentUser || !selectedPlanId) return;

    const plan = state.plans.find(x => x.id === selectedPlanId);
    if(!plan) return;

    const isTrial=plan.is_free_trial===true;
    const file = document.getElementById('paymentProof').files[0];
    const note = document.getElementById('paymentNote').value.trim();
    const button = document.getElementById('submitSubscriptionBtn');

    if(isTrial){
        if(hasUsedFreeTrial()){
            showToast('لقد تم استخدام التجربة المجانية لهذا الحساب من قبل');
            return;
        }
    }else{
        if(!file){
            showToast('من فضلك أرفق صورة التحويل');
            return;
        }

        if(!file.type.startsWith('image/')){
            showToast('يرجى اختيار صورة صحيحة');
            return;
        }

        if(file.size > 5 * 1024 * 1024){
            showToast('حجم الصورة يجب ألا يتجاوز 5 ميجابايت');
            return;
        }
    }

    button.disabled = true;
    button.textContent = isTrial ? 'جاري بدء التجربة...' : 'جاري إرسال الطلب...';

    let filePath=null;

    if(!isTrial){
        const extension = (file.name.split('.').pop() || 'jpg').toLowerCase();
        filePath = `${currentUser.id}/transfer-${Date.now()}.${extension}`;

        const { error: uploadError } = await sb.storage
            .from('subscription-proofs')
            .upload(filePath, file, {
                cacheControl: '3600',
                upsert: false
            });

        if(uploadError){
            console.error('UPLOAD ERROR:', uploadError);
            button.disabled = false;
            button.textContent = 'إرسال طلب الاشتراك';
            showDetailedError('خطأ رفع صورة التحويل', uploadError);
            return;
        }
    }

    const { error: insertError } = await sb
        .from('subscriptions')
        .insert({
            user_id: currentUser.id,
            full_name: currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email || null,
            plan_id: plan.id,
            status: 'pending',
            notes: isTrial ? null : (note || null),
            payment_proof_path: filePath
        });

    if(insertError){
        console.error(insertError);
        if(filePath){
            await sb.storage.from('subscription-proofs').remove([filePath]);
        }
        button.disabled = false;
        button.textContent = isTrial ? 'بدء التجربة المجانية' : 'إرسال طلب الاشتراك';
        showDetailedError(isTrial ? 'تعذر بدء التجربة المجانية' : 'خطأ إنشاء طلب الاشتراك', insertError);
        return;
    }

    closeSubscribeModal();
    button.disabled = false;
    button.textContent = 'إرسال طلب الاشتراك';
    showToast(isTrial ? 'تم بدء التجربة المجانية بنجاح' : 'تم إرسال طلب الاشتراك بنجاح، وسيتم مراجعته وتفعيله يدويًا');
    await loadPlans();
}


async function replacePendingProof(){
  if(!currentSubscription || currentSubscription.status!=='pending'){
    showToast('لا يمكن تعديل إثبات الدفع الآن');
    return;
  }

  const file=document.getElementById('paymentProof').files[0];
  if(!file){
    showToast('اختر صورة الإثبات الجديدة أولًا');
    return;
  }
  if(!file.type.startsWith('image/')){
    showToast('يرجى اختيار صورة صحيحة');
    return;
  }
  if(file.size>5*1024*1024){
    showToast('حجم الصورة يجب ألا يتجاوز 5 ميجابايت');
    return;
  }

  const oldPath=currentSubscription.payment_proof_path;
  const extension=(file.name.split('.').pop()||'jpg').toLowerCase();
  const newPath=`${currentUser.id}/transfer-${Date.now()}.${extension}`;

  try{
    const {error:uploadError}=await sb.storage.from('subscription-proofs').upload(newPath,file,{
      cacheControl:'3600',
      upsert:false
    });
    if(uploadError)throw uploadError;

    const note=document.getElementById('paymentNote').value.trim();
    const {error:updateError}=await sb.from('subscriptions')
      .update({payment_proof_path:newPath,notes:note||null})
      .eq('id',currentSubscription.id)
      .eq('user_id',currentUser.id)
      .eq('status','pending');

    if(updateError){
      await sb.storage.from('subscription-proofs').remove([newPath]);
      throw updateError;
    }

    if(oldPath)await sb.storage.from('subscription-proofs').remove([oldPath]);

    showToast('تم تعديل إثبات الدفع بنجاح');
    closeSubscribeModal();
    await loadPlans();
  }catch(error){
    showDetailedError('تعذر تعديل إثبات الدفع',error);
  }
}

async function cancelPendingSubscription(){
  if(!currentSubscription || currentSubscription.status!=='pending'){
    showToast('لا يمكن إلغاء هذا الطلب');
    return;
  }

  const confirmed=confirm('هل أنت متأكد من إلغاء طلب الاشتراك؟\\nسيتم تغيير حالة الطلب إلى "canceled".');
  if(!confirmed)return;

  const {error}=await sb.from('subscriptions')
    .update({status:'canceled'})
    .eq('id',currentSubscription.id)
    .eq('user_id',currentUser.id)
    .eq('status','pending');

  if(error){
    showDetailedError('تعذر إلغاء طلب الاشتراك',error);
    return;
  }

  showToast('تم إلغاء طلب الاشتراك');
  closeSubscribeModal();
  await loadPlans();
}

function showDetailedError(title, error){
    const message = error?.message || error?.error_description || 'خطأ غير معروف';
    const details = error?.details || '';
    const hint = error?.hint || '';
    const code = error?.code || '';

    const html = `
        <div id="errorOverlay" style="position:fixed;inset:0;background:rgba(14,40,37,.58);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px">
            <div style="width:100%;max-width:560px;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);direction:rtl">
                <h2 style="margin:0 0 14px;font-size:19px;color:#b42318">${escapeHtml(title)}</h2>
                <div style="background:#fff5f5;border:1px solid #f1caca;border-radius:10px;padding:13px;line-height:1.8;font-size:13px;word-break:break-word">
                    <strong>الخطأ:</strong><br>${escapeHtml(message)}
                    ${code ? `<br><br><strong>Code:</strong> ${escapeHtml(code)}` : ''}
                    ${details ? `<br><br><strong>Details:</strong><br>${escapeHtml(details)}` : ''}
                    ${hint ? `<br><br><strong>Hint:</strong><br>${escapeHtml(hint)}` : ''}
                </div>
                <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="document.getElementById('errorOverlay')?.remove()">إغلاق</button>
            </div>
        </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
}

document.getElementById('subscribeModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSubscribeModal()});
document.addEventListener('DOMContentLoaded',async()=>{if(await checkUser())await loadPlans()});
</script>
</body>
</html>
