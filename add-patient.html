<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Patient - NICU Nutrition Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f8fafc;
        }
        .header-bg {
            background-color: #1e3a8a; /* Dark Blue from your images */
        }
    </style>
</head>
<body>

    <!-- Header Section (Matches your UI) -->
    <div class="header-bg text-white p-6 shadow-lg text-center relative">
        <a href="index.html" class="absolute left-4 top-6 text-white hover:text-blue-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 class="text-2xl font-bold">NICU Nutrition Pro</h1>
        <p class="text-sm opacity-80 mt-1">Dr. Ahmed Galal - Nutrition Support</p>
    </div>

    <div class="max-w-md mx-auto mt-10 p-4">
        <div class="bg-white rounded-2xl shadow-md p-8 border border-gray-100">
            <h2 class="text-xl font-bold text-center text-blue-900 mb-8">Register New Patient</h2>

            <form id="addPatientForm" class="space-y-6">
                <!-- Patient Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Patient Name</label>
                    <input type="text" id="full_name" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Enter patient full name">
                </div>

                <!-- Medical Number -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Medical ID / Number</label>
                    <input type="text" id="medical_id" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Example: 2024-001">
                </div>

                <!-- Birth Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Birth Date</label>
                    <input type="date" id="birth_date" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Save Button -->
                <button type="submit" id="saveBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 transform active:scale-95 mt-4">
                    Save Patient
                </button>
            </form>

            <div id="statusMsg" class="mt-4 p-3 rounded-lg text-center hidden"></div>
        </div>
    </div>

    <!-- Load configuration first -->
    <script src="supabase-config.js"></script>

    <script>
        const form = document.getElementById('addPatientForm');
        const statusMsg = document.getElementById('statusMsg');
        const saveBtn = document.getElementById('saveBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Disable button during saving
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const fullName = document.getElementById('full_name').value;
            const medicalId = document.getElementById('medical_id').value;
            const birthDate = document.getElementById('birth_date').value;

            // Using window.supabaseClient defined in supabase-config.js
            const { data, error } = await window.supabaseClient
                .from('patients')
                .insert([
                    { 
                        full_name: fullName, 
                        medical_id: medicalId, 
                        birth_date: birthDate 
                    }
                ]);

            if (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "mt-4 p-3 rounded-lg text-center bg-red-100 text-red-700";
                statusMsg.classList.remove('hidden');
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Patient';
            } else {
                statusMsg.textContent = "Patient registered successfully!";
                statusMsg.className = "mt-4 p-3 rounded-lg text-center bg-green-100 text-green-700";
                statusMsg.classList.remove('hidden');
                
                // Clear the form
                form.reset();
                
                // Optional: Redirect to Dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
