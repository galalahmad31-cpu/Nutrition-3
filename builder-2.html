<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بناء الخطة الغذائية | Diet Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,sans-serif;background:#f8fafc;color:#0f172a}.scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700;outline:none;transition:.2s}.input:focus{background:#fff;border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.btn{border-radius:11px;padding:9px 13px;font-size:11px;font-weight:900;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn:hover{transform:translateY(-1px)}
.day.active{background:#059669;color:white;border-color:#059669;box-shadow:0 4px 12px rgba(5,150,105,.2)}
.meal{border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;background:#fff}.meal-head{background:#f8fafc;border-bottom:1px solid #e2e8f0}.item-row{border-bottom:1px solid #f1f5f9}.item-row:last-child{border-bottom:0}
.kpi{border-radius:14px;padding:12px;border:1px solid #e2e8f0}.bar{height:6px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:20px;background:#059669}
.modal{background:#fff;border-radius:20px;width:min(1050px,96vw);max-height:92vh;overflow:hidden;box-shadow:0 25px 70px rgba(15,23,42,.25)}
</style>
</head>
<body class="min-h-screen">
<iframe id="libFrame" src="lib.html" class="hidden" aria-hidden="true"></iframe>
<header class="bg-slate-900 text-white sticky top-0 z-30 border-b border-slate-800">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
  <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center"><i class="fa-solid fa-clipboard-list"></i></div><div><h1 class="font-black text-lg">بناء الخطة الغذائية</h1><p class="text-[10px] text-emerald-300 font-bold">Diet Builder — من مكتبة الأغذية إلى meals.html</p></div></div>
  <div class="flex gap-2"><button class="btn bg-slate-800 text-slate-200" onclick="window.parent&&window.parent!==window?window.parent.postMessage({type:'BUILDER_CLOSE'},'*'):history.back()"><i class="fa-solid fa-arrow-right"></i> الرجوع</button><button class="btn bg-emerald-600 text-white" onclick="openCodeModal()"><i class="fa-solid fa-code"></i> توليد الكود</button></div>
 </div>
</header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 space-y-5">
 <section class="card p-4 sm:p-5">
  <div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-sliders text-emerald-600"></i><h2 class="font-black text-sm">بيانات الدايت والأهداف</h2></div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3">
   <div class="lg:col-span-2"><label class="block text-[10px] font-black text-slate-500 mb-1">اسم الدايت</label><input id="dietName" class="input" placeholder="مثال: دايت 1800 سعر"></div>
   <div class="lg:col-span-2"><label class="block text-[10px] font-black text-slate-500 mb-1">وصف الدايت</label><input id="dietDescription" class="input" placeholder="مثال: 3 وجبات رئيسية + 2 سناك"></div>
   <div><label class="block text-[10px] font-black text-amber-600 mb-1">السعرات / يوم</label><input id="targetCal" type="number" value="1800" class="input" oninput="renderAll()"></div>
   <div><label class="block text-[10px] font-black text-slate-600 mb-1">Protein %</label><input id="targetPro" type="number" value="20" class="input" oninput="renderAll()"></div>
   <div><label class="block text-[10px] font-black text-slate-600 mb-1">Carb %</label><input id="targetCarb" type="number" value="60" class="input" oninput="renderAll()"></div>
   <div><label class="block text-[10px] font-black text-slate-600 mb-1">Fat %</label><input id="targetFat" type="number" value="20" class="input" oninput="renderAll()"></div>
  </div>
 </section>
 <div class="flex items-center gap-2 overflow-x-auto scroll pb-1" id="daysBar"></div>
 <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_330px] gap-5 items-start">
  <section class="card overflow-hidden">
   <div class="bg-slate-900 text-white p-4 flex flex-col sm:flex-row justify-between gap-3 sm:items-center">
    <div><div class="flex items-center gap-2"><span id="dayBadge" class="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center text-xs font-black">1</span><input id="dayTitle" class="bg-transparent border-b border-slate-700 focus:border-emerald-400 outline-none font-black text-base px-1" value="اليوم 1" onchange="updateDayTitle(this.value)"></div><p class="text-[10px] text-slate-400 mt-1">ابنِ اليوم كما ستظهر الخطة للعميل</p></div>
    <div class="flex gap-2"><button class="btn bg-white/10 text-white hover:bg-white/15" onclick="addDay()"><i class="fa-solid fa-plus"></i> يوم جديد</button><button class="btn bg-rose-500/15 text-rose-200 hover:bg-rose-500/25" onclick="removeDay()"><i class="fa-solid fa-trash"></i> حذف اليوم</button></div>
   </div>
   <div id="mealsArea" class="p-4 space-y-4"></div>
   <div class="px-4 pb-4"><button class="btn w-full border-2 border-dashed border-emerald-200 text-emerald-700 bg-emerald-50/40 hover:bg-emerald-50" onclick="addMeal()"><i class="fa-solid fa-plus"></i> إضافة وجبة جديدة</button></div>
  </section>
  <aside class="space-y-4 lg:sticky lg:top-24">
   <section class="card overflow-hidden"><div class="p-4 bg-gradient-to-l from-emerald-700 to-teal-600 text-white"><div class="flex justify-between items-center"><div><p class="text-[10px] text-emerald-100 font-bold">المراجعة اليومية</p><h2 class="font-black text-lg">مجمل اليوم</h2></div><i class="fa-solid fa-chart-pie text-2xl opacity-80"></i></div></div><div id="summary" class="p-4"></div></section>
   <section class="card p-4"><div class="flex items-center justify-between mb-3"><h3 class="font-black text-xs">إدارة الأيام</h3><span id="dayCount" class="text-[10px] font-bold text-slate-400"></span></div><button class="btn w-full bg-emerald-600 text-white" onclick="openCodeModal()"><i class="fa-solid fa-file-code"></i> توليد كود meals.html</button><p class="text-[10px] text-slate-400 leading-5 mt-2">كل يوم سيتم توليده كـ Diet مستقل داخل <b>FIXED_MEALS</b>.</p></section>
  </aside>
 </div>
</main>
<div id="codeModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="if(event.target===this)closeCodeModal()">
 <div class="modal"><div class="p-4 bg-slate-900 text-white flex justify-between items-center"><div><h3 class="font-black text-sm">الكود الجاهز لـ meals.html</h3><p class="text-[10px] text-slate-400 mt-1">انسخه داخل ملف meals.html بدل/مع FIXED_MEALS</p></div><button class="text-slate-300 hover:text-white" onclick="closeCodeModal()"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="p-4"><div class="flex gap-2 mb-3"><button class="btn bg-emerald-600 text-white" onclick="copyCode()"><i class="fa-solid fa-copy"></i> نسخ الكود</button><button class="btn bg-slate-100 text-slate-700" onclick="generateCode()"><i class="fa-solid fa-rotate"></i> تحديث</button></div><textarea id="code" class="w-full h-[58vh] bg-slate-950 text-slate-100 rounded-xl p-4 font-mono text-xs leading-6 outline-none" dir="ltr" spellcheck="false"></textarea></div></div>
</div>
<div id="toast" class="fixed bottom-5 left-5 z-[60] hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold"></div>
<script>
let FOOD_LIBRARY=[],days=[],activeDay=0,seq=0;const $=id=>document.getElementById(id);const uid=()=>`b_${Date.now()}_${++seq}_${Math.random().toString(36).slice(2,6)}`;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number.isFinite(Number(v))?Number(v):0;const fmt=v=>Number.isInteger(n(v))?String(n(v)):n(v).toFixed(1);
function meal(name){return{id:uid(),name,description:'',items:[]}}function day(){return{id:uid(),title:`اليوم ${days.length+1}`,notes:'',meals:[meal('الفطار'),meal('سناك 1'),meal('الغداء'),meal('سناك 2'),meal('العشاء')]}}
function init(){days=[day()];renderAll()}
function renderAll(){renderDays();renderMeals();renderSummary()}
function renderDays(){$('daysBar').innerHTML=days.map((d,i)=>`<button class="day border border-slate-200 bg-white rounded-xl px-4 py-2 text-xs font-black whitespace-nowrap ${i===activeDay?'active':''}" onclick="activeDay=${i};renderAll()"><i class="fa-solid fa-calendar-day ml-1"></i>${esc(d.title)}</button>`).join('')+`<button class="btn bg-emerald-50 text-emerald-700 border border-emerald-200" onclick="addDay()"><i class="fa-solid fa-plus"></i> يوم</button>`;$('dayBadge').textContent=activeDay+1;$('dayTitle').value=days[activeDay].title;$('dayCount').textContent=`${days.length} ${days.length===1?'يوم':'أيام'}`}
function updateDayTitle(v){days[activeDay].title=v.trim()||`اليوم ${activeDay+1}`;renderDays()}
function addDay(){if(days.length>=31)return toast('الحد الأقصى 31 يوم');days.push(day());activeDay=days.length-1;renderAll()}
function removeDay(){if(days.length===1)return toast('لا يمكن حذف اليوم الوحيد');if(!confirm('حذف اليوم الحالي؟'))return;days.splice(activeDay,1);activeDay=Math.max(0,activeDay-1);renderAll()}
function foodOptions(selected=''){return`<option value="">اختر صنفًا من مكتبة الأغذية...</option>`+FOOD_LIBRARY.map(f=>`<option value="${esc(f.id)}" ${f.id===selected?'selected':''}>${esc(f.name)} — ${fmt(f.calories)} kcal/100g | P ${fmt(f.protein)} | C ${fmt(f.carbs)} | F ${fmt(f.fat)}</option>`).join('')}
function repeatOptions(v='7/7'){return['7/7','7/6','7/5','7/4','7/3','7/2','7/1'].map(x=>`<option value="${x}" ${v===x?'selected':''}>${x}</option>`).join('')}
function renderMeals(){const d=days[activeDay];$('mealsArea').innerHTML=d.meals.map((m,mi)=>{let t=mealTotals(m);return `<article class="meal"><div class="meal-head p-3"><div class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px] font-black">${mi+1}</span><input class="input !bg-white !py-2 !font-black" value="${esc(m.name)}" onchange="updateMeal(${mi},'name',this.value)" placeholder="اسم الوجبة"><input class="input hidden md:block !bg-white !py-2 !font-semibold !text-slate-500" value="${esc(m.description)}" onchange="updateMeal(${mi},'description',this.value)" placeholder="وصف مختصر للوجبة"></div><div class="flex justify-end gap-1 mt-2 sm:mt-0"><button class="btn !p-2 bg-white border border-slate-200 text-slate-500" onclick="moveMeal(${mi},-1)" title="أعلى"><i class="fa-solid fa-chevron-up"></i></button><button class="btn !p-2 bg-white border border-slate-200 text-slate-500" onclick="moveMeal(${mi},1)" title="أسفل"><i class="fa-solid fa-chevron-down"></i></button><button class="btn !p-2 bg-white border border-rose-100 text-rose-500" onclick="deleteMeal(${mi})" title="حذف"><i class="fa-solid fa-trash"></i></button></div></div><div class="px-3 py-2 bg-white">${m.items.length?m.items.map((it,ii)=>itemRow(it,mi,ii)).join(''):`<div class="py-5 text-center text-xs text-slate-400 font-bold">لا توجد أصناف في هذه الوجبة — اختر صنفًا من القائمة بالأسفل</div>`}</div><div class="p-3 bg-slate-50 border-t border-slate-100"><div class="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_120px_90px] gap-2"><select class="input !bg-white" onchange="addFood(${mi},this.value);this.value=''">${foodOptions()}</select><div class="flex items-center justify-center rounded-xl bg-white border border-slate-200 text-[10px] font-black text-slate-500">اختر ثم أضف</div><div class="text-center text-[10px] font-black text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-xl flex items-center justify-center">${fmt(t.calories)} kcal</div></div><div class="mt-2 flex flex-wrap gap-2 text-[10px] font-bold text-slate-500"><span>P ${fmt(t.protein)}g</span><span>C ${fmt(t.carbs)}g</span><span>F ${fmt(t.fat)}g</span></div></div></article>`}).join('')}
function itemRow(it,mi,ii){const f=FOOD_LIBRARY.find(x=>x.id===it.foodId);if(!f)return'';const g=n(it.grams);return `<div class="item-row py-3 grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_100px_110px_95px_34px] gap-2 items-center"><div><div class="font-black text-xs text-slate-800">${esc(f.name)}</div><div class="text-[9px] text-slate-400 mt-1">${esc(f.id)} · ${fmt(f.calories)} kcal/100g · P ${fmt(f.protein)} · C ${fmt(f.carbs)} · F ${fmt(f.fat)}</div></div><div><label class="block text-[9px] font-bold text-slate-400 mb-1">الكمية</label><input class="input !py-2 text-center" type="number" min="0" step="1" value="${g}" onchange="updateItem(${mi},${ii},'grams',this.value)"></div><div><label class="block text-[9px] font-bold text-slate-400 mb-1">التكرار</label><select class="input !py-2" onchange="updateItem(${mi},${ii},'repeat',this.value)">${repeatOptions(it.repeat||'7/7')}</select></div><div class="text-center"><div class="text-[9px] text-slate-400">القيمة</div><b class="text-xs text-emerald-700">${fmt(f.calories*g/100)} kcal</b></div><button class="btn !p-2 text-rose-400 hover:bg-rose-50" onclick="removeItem(${mi},${ii})"><i class="fa-solid fa-xmark"></i></button></div>`}
function addFood(mi,id){if(!id)return;days[activeDay].meals[mi].items.push({itemId:uid(),foodId:id,grams:100,repeat:'7/7'});renderAll()}
function updateItem(mi,ii,key,v){const it=days[activeDay].meals[mi].items[ii];if(!it)return;it[key]=key==='grams'?Math.max(0,n(v)):v;renderAll()}
function removeItem(mi,ii){days[activeDay].meals[mi].items.splice(ii,1);renderAll()}
function updateMeal(i,key,v){days[activeDay].meals[i][key]=v;}
function addMeal(){days[activeDay].meals.push(meal('وجبة جديدة'));renderAll()}
function deleteMeal(i){if(!confirm('حذف هذه الوجبة؟'))return;days[activeDay].meals.splice(i,1);renderAll()}
function moveMeal(i,d){const j=i+d;if(j<0||j>=days[activeDay].meals.length)return;const a=days[activeDay].meals;[a[i],a[j]]=[a[j],a[i]];renderAll()}
function mealTotals(m){return m.items.reduce((t,it)=>{const f=FOOD_LIBRARY.find(x=>x.id===it.foodId),g=n(it.grams);if(!f)return t;t.calories+=n(f.calories)*g/100;t.protein+=n(f.protein)*g/100;t.carbs+=n(f.carbs)*g/100;t.fat+=n(f.fat)*g/100;t.sodium+=n(f.sodium)*g/100;t.potassium+=n(f.potassium)*g/100;t.phosphorus+=n(f.phosphorus)*g/100;return t},{calories:0,protein:0,carbs:0,fat:0,sodium:0,potassium:0,phosphorus:0})}
function dayTotals(d){return d.meals.reduce((a,m)=>{const t=mealTotals(m);Object.keys(a).forEach(k=>a[k]+=t[k]||0);return a},{calories:0,protein:0,carbs:0,fat:0,sodium:0,potassium:0,phosphorus:0})}
function targets(){const cal=Math.max(0,n($('targetCal').value)),p=Math.max(0,n($('targetPro').value)),c=Math.max(0,n($('targetCarb').value)),f=Math.max(0,n($('targetFat').value));return{cal,pPct:p,cPct:c,fPct:f,sum:p+c+f,pro:cal*p/400,carb:cal*c/400,fat:cal*f/900}}
function renderSummary(){const x=targets(),t=dayTotals(days[activeDay]),rows=[['السعرات',t.calories,x.cal,'kcal'],['البروتين',t.protein,x.pro,'g'],['الكارب',t.carbs,x.carb,'g'],['الدهون',t.fat,x.fat,'g']];$('summary').innerHTML=`<div class="text-center pb-4 border-b border-slate-100"><div class="text-[10px] text-slate-400 font-bold">إجمالي اليوم ${activeDay+1}</div><div class="text-3xl font-black text-slate-900 mt-1">${fmt(t.calories)} <span class="text-xs text-slate-400">kcal</span></div><div class="text-[10px] font-bold ${x.sum===100?'text-emerald-600':'text-rose-600'} mt-1">${x.sum===100?'توزيع الماكروز = 100%':'توزيع الماكروز = '+fmt(x.sum)+'% — يجب أن يكون 100%'}</div></div><div class="grid grid-cols-2 gap-2 mt-4">${rows.map(r=>{const pct=r[2]>0?t[r[0]==='السعرات'?'calories':r[0]==='البروتين'?'protein':r[0]==='الكارب'?'carbs':'fat']/r[2]*100:0;const rem=r[2]-t[r[0]==='السعرات'?'calories':r[0]==='البروتين'?'protein':r[0]==='الكارب'?'carbs':'fat'];return `<div class="kpi"><div class="text-[9px] text-slate-400 font-bold">${r[0]}</div><div class="font-black text-sm mt-1">${fmt(t[r[0]==='السعرات'?'calories':r[0]==='البروتين'?'protein':r[0]==='الكارب'?'carbs':'fat'])} <span class="text-[9px] text-slate-400">/ ${fmt(r[2])}${r[3]}</span></div><div class="bar mt-2"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div><div class="text-[9px] text-slate-400 mt-1">${rem>=0?'متبقي: '+fmt(rem):'زيادة: '+fmt(Math.abs(rem))} ${r[3]}</div></div>`}).join('')}</div><div class="mt-3 grid grid-cols-3 gap-2 text-center"><div class="rounded-xl bg-sky-50 border border-sky-100 p-2"><b class="block text-xs text-sky-800">${fmt(t.sodium)}</b><span class="text-[8px] text-sky-600">Na mg</span></div><div class="rounded-xl bg-emerald-50 border border-emerald-100 p-2"><b class="block text-xs text-emerald-800">${fmt(t.potassium)}</b><span class="text-[8px] text-emerald-600">K mg</span></div><div class="rounded-xl bg-purple-50 border border-purple-100 p-2"><b class="block text-xs text-purple-800">${fmt(t.phosphorus)}</b><span class="text-[8px] text-purple-600">P mg</span></div></div>`}
function generateCode(){const name=$('dietName').value.trim()||`دايت ${days.length} يوم`,desc=$('dietDescription').value.trim();let lines=['const FIXED_MEALS = ['];days.forEach((d,di)=>{const t=dayTotals(d);lines.push('  {',`    name: ${JSON.stringify(days.length===1?name:`${name} - ${d.title}`)},`,`    description: ${JSON.stringify(`${desc}${desc?' | ':''}إجمالي اليوم: ${fmt(t.calories)} kcal`)},`,'    meals: [');d.meals.forEach((m,mi)=>{lines.push('      {',`        name: ${JSON.stringify(m.name||'وجبة')},`,`        description: ${JSON.stringify(m.description||'')},`,'        items: [');m.items.forEach((it,ii)=>lines.push(`          { foodId: ${JSON.stringify(it.foodId)}, grams: ${n(it.grams)}, repeat: ${JSON.stringify(it.repeat||'7/7')} }${ii<m.items.length-1?',':''}`));lines.push(`        ]\n      }${mi<d.meals.length-1?',':''}`)});lines.push(`    ]\n  }${di<days.length-1?',':''}`)});lines.push('];');$('code').value=lines.join('\n')}
function openCodeModal(){generateCode();$('codeModal').classList.remove('hidden');$('codeModal').classList.add('flex')}function closeCodeModal(){$('codeModal').classList.add('hidden');$('codeModal').classList.remove('flex')}async function copyCode(){generateCode();try{await navigator.clipboard.writeText($('code').value)}catch(e){$('code').select();document.execCommand('copy')}toast('تم نسخ الكود')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add('hidden'),2200)}
$('libFrame').addEventListener('load',()=>{try{const lib=$('libFrame').contentWindow.FOOD_LIBRARY;if(Array.isArray(lib)){FOOD_LIBRARY=lib;renderAll()}else toast('تعذر قراءة FOOD_LIBRARY')}catch(e){toast('تعذر تحميل مكتبة الأغذية')}});init();
</script>
</body></html>
