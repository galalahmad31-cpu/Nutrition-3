</div><div><h1>الدعم الغذائي</h1><p>Nutrition Support</p></div></div>
<div class="header-actions"><a class="home-btn" href="app.html"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a></div>
</header>
<div class="support-patient-area no-print" id="supportPatientArea">
<div class="support-patient-top">
<div>
<div class="support-kicker">الدعم الغذائي</div>
<h2>اختر المريض</h2>
<p>بيانات المريض تُقرأ مباشرة من قائمة المرضى.</p>
</div>
</div>
<div class="patient-search"><i class="fa-solid fa-magnifying-glass"></i><input id="patientSearch" type="search" placeholder="ابحث باسم المريض أو التشخيص..." autocomplete="off"></div>
<div class="patient-grid" id="patientGrid"></div>
<div class="patient-empty" id="patientEmpty" style="display:none">لا يوجد مرضى حاليًا.</div>
</div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://zwxnmnfoknfbzvptnpmv.supabase.co','sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY');
let patients=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderPatients(){
  const grid=$('patientGrid'), q=($('patientSearch').value||'').trim().toLowerCase();
  const list=patients.filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.diagnosis||'').toLowerCase().includes(q));
  grid.innerHTML='';
  $('patientEmpty').textContent=q&&!list.length?'لا توجد نتائج مطابقة.':patients.length?'':'لا يوجد مرضى حاليًا.';
  $('patientEmpty').style.display=list.length?'none':'block';
  list.forEach(p=>{
    const b=document.createElement('button');
    b.type='button'; b.className='patient-card'; b.dataset.id=p.id;
    b.innerHTML=`<div class="pc-icon"><i class="fa-solid fa-user"></i></div><div><strong>${esc(p.name||'بدون اسم')}</strong><span>${esc(p.diagnosis||'بدون تشخيص')}</span></div>`;
    grid.appendChild(b);
  });
}
$('patientGrid').addEventListener('click',e=>{
  const card=e.target.closest('[data-id]');
  if(card) location.href='nutritionsupport-patient.html?patient='+encodeURIComponent(card.dataset.id);
});
$('patientSearch').addEventListener('input',renderPatients);
(async()=>{
  try{
    const {data:{session},error}=await supabase.auth.getSession();
    if(error||!session){location.replace('index.html');return;}
    const {data,error:pe}=await supabase.from('patients')
      .select('id,name,gender,birth_date,age,height,diagnosis,complaints,clinical_notes')
      .eq('user_id',session.user.id).order('name');
    if(pe) throw pe;
    patients=data||[]; renderPatients();
  }catch(e){
    console.error(e); $('patientEmpty').textContent='تعذر تحميل قائمة المرضى'; $('patientEmpty').style.display='block';
  }
})();
</script>
</body>
</html>
