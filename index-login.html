<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — تسجيل الدخول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f4f7fb,#e8eef7);display:flex;align-items:center;justify-content:center;color:#172033}.card{width:min(430px,92%);background:#fff;border-radius:22px;box-shadow:0 18px 55px rgba(25,45,75,.14);padding:30px}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700}h1{text-align:center;margin:0;font-size:25px}.sub{text-align:center;color:#667085;margin:8px 0 25px}.tabs{display:flex;background:#f1f4f8;padding:4px;border-radius:12px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:9px;cursor:pointer;font-weight:600;color:#667085}.tabs button.active{background:#fff;color:#2563eb;box-shadow:0 2px 8px #0000000f}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;outline:0;font-size:15px}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-bottom:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.msg.error{background:#fef2f2;color:#b42318}.msg.success{background:#ecfdf3;color:#067647}
</style>
</head>
<body>
<div class="card">
<div class="logo">D</div>
<h1>Diet Planner</h1>
<div class="sub">نظام إدارة الخطط الغذائية</div>
<div class="tabs">
<button type="button" data-auth-tab="loginForm" class="active">تسجيل الدخول</button>
<button type="button" data-auth-tab="registerForm">إنشاء حساب</button>
</div>
<div id="authMessage" class="msg"></div>
<form id="loginForm" class="auth-form" onsubmit="return false">
<div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div>
<div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
<button id="loginButton" type="button" class="btn">تسجيل الدخول</button>
</form>
<form id="registerForm" class="auth-form" style="display:none" onsubmit="return false">
<div class="field"><label>الاسم</label><input id="registerName" type="text" autocomplete="name"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="registerEmail" type="email" autocomplete="email"></div>
<div class="field"><label>كلمة المرور</label><input id="registerPassword" type="password" autocomplete="new-password"></div>
<button id="registerButton" type="button" class="btn">إنشاء الحساب</button>
</form>
</div>
<script src="auth.js"></script>
</body>
</html>
