<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — استعادة كلمة المرور</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/forgot-password.css">
  <link rel="stylesheet" href="css/theme.css?v=20260921-1" data-diet-planner-theme="true">
  <script src="js/theme.js?v=20260921-1" data-diet-planner-theme="true"></script>
</head>
<body>
<div class="card">
<div class="logo">↻</div>
<h1>استعادة كلمة المرور</h1>
<div class="sub">أدخل البريد الإلكتروني المسجل في الحساب وسنرسل لك رابطًا لإنشاء كلمة مرور جديدة.</div>
<div id="message" class="msg"></div>
<form id="forgotForm">
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required></div>
<button id="sendButton" type="submit" class="btn">إرسال رابط الاستعادة</button>
</form>
<div class="back"><a href="index.html">العودة إلى تسجيل الدخول</a></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = 'https://zwxnmnfoknfbzvptnpmv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('forgotForm');
  const emailInput = document.getElementById('email');
  const button = document.getElementById('sendButton');
  const message = document.getElementById('message');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `msg ${type}`;
    message.style.display = 'block';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
      showMessage('من فضلك أدخل البريد الإلكتروني.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'جاري الإرسال...';
    message.style.display = 'none';

    try {
      // Always return to the production update-password page.
      // Do not build this URL from window.location, otherwise a localhost
      // URL can be embedded in the recovery email when testing locally.
      const redirectTo = 'https://nutrition-3.vercel.app/update-password.html';

      const { error } = await supabase.auth.resetPasswordForEmail(
        email,
        { redirectTo }
      );

      if (error) {
        throw error;
      }

      showMessage(
        'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. راجع البريد الوارد والرسائل غير المرغوب فيها.',
        'success'
      );
    } catch (error) {
      showMessage(
        `تعذر إرسال رابط الاستعادة: ${error?.message || 'حدث خطأ غير معروف.'}`,
        'error'
      );
    } finally {
      button.disabled = false;
      button.textContent = 'إرسال رابط الاستعادة';
    }
  });
});
</script>
</body>
</html>
