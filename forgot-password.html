<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Planner — استعادة كلمة المرور</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:#f7fafb;display:flex;align-items:center;justify-content:center;color:#17252a}.card{width:min(430px,92%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 45px rgba(15,71,67,.10);padding:30px}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:#178f84;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px}h1{text-align:center;margin:0;font-size:24px;font-weight:800}.sub{text-align:center;color:#64748b;margin:8px 0 25px;font-size:13px;line-height:1.8}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;outline:0;font-size:15px;font-family:inherit}.field input:focus{border-color:#178f84;box-shadow:0 0 0 3px rgba(23,143,132,.08)}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#178f84;color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.back{text-align:center;margin-top:16px}.back a{color:#11786f;text-decoration:none;font-size:12px;font-weight:700}.msg{display:none;margin-bottom:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.msg.error{background:#fef2f2;color:#b42318}.msg.success{background:#ecfdf3;color:#067647}
</style>
</head>
<body>
<div class="card">
<div class="logo">↻</div>
<h1>استعادة كلمة المرور</h1>
<div class="sub">أدخل البريد الإلكتروني المسجل في الحساب وسنرسل لك رابطًا لإنشاء كلمة مرور جديدة.</div>
<div id="message" class="msg"></div>
<form id="forgotForm">
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required></div>
<button id="sendButton" type="submit" class="btn">إرسال رابط الاستعادة</button>
</form>
<div class="back"><a href="index.html">العودة إلى تسجيل الدخول</a></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = 'https://zwxnmnfoknfbzvptnpmv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A6u5kWAdL60bYpz1wRyv6w_J2p896iY';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('forgotForm');
  const emailInput = document.getElementById('email');
  const button = document.getElementById('sendButton');
  const message = document.getElementById('message');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `msg ${type}`;
    message.style.display = 'block';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
      showMessage('من فضلك أدخل البريد الإلكتروني.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'جاري الإرسال...';
    message.style.display = 'none';

    try {
      const redirectTo = new URL(
        'update-password.html',
        window.location.href
      ).href;

      const { error } = await supabase.auth.resetPasswordForEmail(
        email,
        { redirectTo }
      );

      if (error) {
        throw error;
      }

      showMessage(
        'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. راجع البريد الوارد والرسائل غير المرغوب فيها.',
        'success'
      );
    } catch (error) {
      showMessage(
        `تعذر إرسال رابط الاستعادة: ${error?.message || 'حدث خطأ غير معروف.'}`,
        'error'
      );
    } finally {
      button.disabled = false;
      button.textContent = 'إرسال رابط الاستعادة';
    }
  });
});
</script>
</body>
</html>
